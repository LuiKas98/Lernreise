function pathSvg(pts,dx,col){
 if(pts.length<4||Math.hypot(pts[pts.length-1][0]-pts[0][0],pts[pts.length-1][1]-pts[0][1])<2&&pts.length<6)return '<circle cx="'+(pts[0][0]+dx)+'" cy="'+pts[0][1]+'" r="8" fill="'+col+'"/>';
 return '<path d="'+pts.map((q,i)=>(i?'L':'M')+(q[0]+dx).toFixed(1)+' '+q[1].toFixed(1)).join('')+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>'}

const capOf=id=>{const u=UNITS[id];return u.up?(u.multi?u.lo.toUpperCase():u.up):u.lo};
function capSvg(id){const t=capOf(id),lay=layoutText(t),w=lay.w+16;return '<svg class="capsv" viewBox="-8 -38 '+w+' 148" aria-hidden="true" focusable="false">'+lay.items.map(it=>it.g.s.map(p=>pathSvg(p,it.x,'currentColor')).join('')).join('')+'</svg>'}
function hearTasks(id){
 const ws=WORDS.filter(w=>w.lt.filter(x=>x===id).length===1);
 const kn=[...knownSet()];
 const tasks=[];
 const pos=w=>{const i=w.lt.indexOf(id);return i===0?'a':i===w.lt.length-1?'e':'m'};
 const byPos={a:[],m:[],e:[]};ws.forEach(w=>byPos[pos(w)].push(w));
 /* Aufgabentyp 1: Wo hörst du den Laut? */
 const p1=sh(ws).slice(0,3);p1.forEach(w=>tasks.push({t:'pos',w:w,ans:pos(w)}));
 /* Aufgabentyp 2: Welcher Laut am Anfang / Ende? (Buchstabe wählen) */
 const starts=ws.filter(w=>w.lt[0]===id),ends=ws.filter(w=>w.lt[w.lt.length-1]===id);
 let letters=kn.filter(x=>x!==id&&UNITS[x].multi===UNITS[id].multi);if(letters.length<2)letters=Object.keys(UNITS).filter(x=>x!==id&&UNITS[x].multi===UNITS[id].multi&&(UNITS[x].up||true));
 const dis=(ans)=>sh(letters.filter(x=>x!==ans&&UNITS[x].multi===UNITS[id].multi)).slice(0,2);
 const mkc=(w,which)=>{const ans=which==='a'?w.lt[0]:w.lt[w.lt.length-1];const d=dis(ans);const opts=sh([ans].concat(d.length>=1?d:[]));return {t:'pick',w:w,which:which,ans:ans,opts:opts}};
 sh(starts).slice(0,2).forEach(w=>tasks.push(mkc(w,'a')));
 sh(ends).slice(0,1).forEach(w=>tasks.push(mkc(w,'e')));
 /* Wörter mit anderem Anlaut als Kontrast, damit nicht jede Antwort gleich ist */
 const out=[],seen=new Set();sh(tasks).forEach(x=>{const k=x.t+x.w.w;if(!seen.has(k)){seen.add(k);out.push(x)}});
 return out.slice(0,5)}

 setMain(stageHTML(id,'Laute hören',''));bindTop();
 if(tasks.length<2){$('#task').textContent='Zu diesem Buchstaben gibt es noch nicht genug Hörwörter.';$('#bhost').innerHTML='<div class="dbtn"><button class="big sm" id="sk">Station als geschafft markieren</button></div>';$('#sk').addEventListener('click',()=>result(id,'h','Weiter geht es mit der nächsten Station.',()=>hearGame(id)));return}

  else{h+='<div class="optsL" role="group" aria-label="Antworten">'+t.opts.map(o=>'<button class="op ol" data-a="'+o+'" aria-label="'+esc(capOf(o))+'">'+capSvg(o)+'</button>').join('')+'</div>'}
  bh.innerHTML=h;

  let wr=0,lock=false;

   if(b.dataset.a===t.ans){lock=true;b.classList.add('good');sfx.ok();$('#task').innerHTML='Richtig! <b>'+esc(w.w)+'</b>';
    setTimeout(()=>{i++;if(i<tasks.length)next();else result(id,'h','Du hörst die Laute heraus.',()=>hearGame(id))},1100)}
   else{b.classList.add('bad');sfx.no();wr++;b.disabled=true;if(wr>=1)play()}}))}
 next()}

function learnedSet(id){ /* Buchstaben, die schon gelernt sind: in der Reihenfolge der Fibel bis zum aktuellen Buchstaben */
 const o=order();
 if(id){const i=o.indexOf(id);return new Set(o.slice(0,i<0?o.length:i+1))}
 if(isAdmin()||DB.cfg.all)return new Set(o);
 const st=DB.cfg.stand,si=st?o.indexOf(st):-1;
 return new Set(o.filter((x,i)=>i<=si||doneN(x)>0))}
function wordsFor(id){
 const kn=learnedSet(id),WEAK=['sp','st','ng','nk','ck'];
 return WORDS.filter(w=>w.u.every(x=>kn.has(x)||(WEAK.includes(x)&&[...x].every(c=>kn.has(c))))&&(!id||w.u.includes(id)))}

  function build(guided){mount.innerHTML='';
   if(curBoard)curBoard.destroy();

  let b=build(false);
  ctr.innerHTML='<button class="big sm" id="pb" disabled>✔ Prüfen</button><button class="chip" id="er" aria-pressed="false">🧽 Radieren</button><button class="chip" id="cl">🗑️ Neu</button><button class="chip" id="md">🙈 Vorlage ausblenden</button><p class="fb" id="fb" role="status"></p>';

  pb.addEventListener('click',()=>{const res=b.check(),all=res.every(x=>x.ok);
   if(all){sfx.ok();fb.className='fb ok';fb.textContent=res.every(x=>x.dirOk!==false)?'Super geschrieben!':'Gut! Achte auf die Schreibrichtung.';pb.disabled=true;done()}
   else{fails++;
    const miss=res.map((r,k)=>!r.ok&&r.why==='leer'?k:-1).filter(k=>k>=0),bad=res.map((r,k)=>!r.ok&&r.why!=='leer'?k:-1).filter(k=>k>=0);
    fb.className='fb';
    if(!bad.length){ /* nur vergessene Buchstaben: kein Fehler, sondern ein Tipp */
     sfx.tick();const ml=miss.map(k=>b.lay.items[k].ch);
     fb.innerHTML='Schon gut! Es fehlt noch '+(ml.length===1?'ein Buchstabe':'etwas')+': Sprich das Wort langsam mit und schau auf die blauen Punkte. Hier fehlt das <b>'+esc(ml.join(', '))+'</b>.'}
    else{sfx.no();const wr=res[bad[0]],hint=whyMsg(wr)&&wr.why!=='striche'?' '+whyMsg(wr):'';

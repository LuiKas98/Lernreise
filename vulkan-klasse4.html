 G.state='ask';renderPuz()}
function renderPuz(){const p=G.puz;G.pt=0;$('#pz').innerHTML=`<div class="q" id="qq">${p.q}</div>${p.vis?`<div class="vis">${p.vis}</div>`:''}<div class="opts ${p.cls}" role="group" aria-label="Antworten">${p.opts.map((o,i)=>`<button class="o" data-i="${i}" aria-label="${esc(o.l)}" onclick="answer(${i})">${o.h}</button>`).join('')}</div><p class="row"><button class="sm" onclick="speak()">🔊 Vorlesen</button><span class="mini" id="fb" role="status"></span></p>`;paintBars()}
function paintBars(){if(!G)return;if(hasLava()){const H=innerHeight,lv=$('#lavabg .lv');lv&&(lv.style.transform=`translateY(${((1-G.lava/100)*(H+40)).toFixed(1)}px)`);const bg=$('#lavabg');bg&&bg.classList.toggle('hot',G.lava>75);const f=$('#lfl');if(f){if(G.floor>0){f.style.display='block';f.style.top=((1-G.floor/100)*(H+40)).toFixed(1)+'px'}else f.style.display='none'}const t=$('#lt');t&&(t.textContent=`🌋 Lava ${Math.round(G.lava)} %`)}
 if(hasFuse()){const w=G.fuseMax?Math.max(0,G.fuseT/G.fuseMax*100):100,fr=$('#fr'),fs=$('#fs');if(fr){fr.style.width=w+'%';fr.classList.toggle('low',w<30)}if(fs)fs.style.left=(100-w)+'%'}
 const sc=$('#sc');if(sc)sc.innerHTML=`Welle <b>${G.wave}</b> · Punkte <b>${G.score}</b>${G.streak>1?` · 🔥 ${G.streak} in Folge`:''}`;
 const d=document.querySelectorAll('#dots i');d.forEach((x,k)=>{x.className=G.res&&G.res[k]===1?'g':G.res&&G.res[k]===0?'r':k==G.done?'c':''})}
function tick(now){raf=requestAnimationFrame(tick);if(!G)return;const dt=Math.min(.1,(now-lastT)/1000);lastT=now;if(G.paused||G.speaking||G.state!='ask')return;G.pt+=dt;
 if(hasLava())G.lava+=lavaRate()*dt;if(hasFuse()){G.fuseT-=dt;if(G.fuseT<=0){G.fuseT=0;paintBars();return answer(-1)}}
 if(G.lava>=100){G.lava=100;paintBars();return answer(-2)}paintBars()}
const pushFrac=()=>hasFuse()?G.fuseT/G.fuseMax:Math.max(0,1-G.pt/(10*calm()*(G.puz.tm||1)));
function answer(i){if(!G||G.state!='ask')return;G.state='reveal';const p=G.puz,ok=i==p.a,lost=i==-2;G.res=G.res||[];
 const bs=document.querySelectorAll('.o');bs.forEach((b,k)=>{b.disabled=true;if(k==p.a)b.classList.add('ok');else if(k==i)b.classList.add('no');else b.classList.add('dim')});
 const fb=$('#fb');U.n++;G.done++;
 if(ok){U.r++;G.right++;G.streak++;G.res[G.done-1]=1;const fr=pushFrac();let msg='✔ Richtig!';if(hasLava()){const before=G.lava,push=4+8*fr;G.lava=Math.max(G.floor,G.lava-push);const dd=Math.round(before-G.lava);msg+=fr>.66?' ⚡ Blitzschnell!':'';msg+=dd>0?` 🌋 −${dd} %`:' (Lava am Sockel)'}if(G.arc){G.score+=10+Math.ceil(hasFuse()?G.fuseT:0)+Math.min(G.streak,10)*2}fb.textContent=msg}
 else{G.m++;G.streak=0;G.res[G.done-1]=0;if(hasLava())G.lava=Math.min(100,G.lava+(i==-1&&hasFuse()?18:14));const to=i<0;G.faults.push({q:plain(p.q),a:p.opts[p.a].l});U.f.push({q:plain(p.q),a:p.opts[p.a].l,g:to?'(keine Zeit)':p.opts[i].l,l:G.cfg.id});if(U.f.length>60)U.f.shift();fb.textContent=lost?'🌋 Die Lava ist oben!':i==-1?'⏰ Die Schnur ist abgebrannt. Das war richtig: '+p.opts[p.a].l:'Das war richtig: '+p.opts[p.a].l}
 if(G.arc){G.wd++;if(G.wd>=6){G.wd=0;G.wave++;G.floor=Math.min(40,(G.wave-1)*5);G.lava=Math.max(G.floor,G.lava-8);G.score+=50;fb.textContent+=` 🎉 Welle ${G.wave-1} geschafft!`}}
 save();paintBars();const wait=ok?650:1900;G.nxT=setTimeout(()=>{if(!G)return;if(G.lava>=100&&hasLava())return finish();nextPuz()},wait)}
function togglePause(){if(!G||G.state=='count')return;G.paused=!G.paused;$('#ps').textContent=G.paused?'▶ Weiter':'⏸ Pause';if(G.paused){const o=ovl(`<div class="card c"><h1>⏸ Pause</h1><p>Die Zeit steht still.</p><p><button class="big" onclick="togglePause()">▶ Weiter</button></p><p><button class="sec" onclick="$('#ov').remove();quitRun()">Abbrechen</button></p></div>`);o.dataset.run=1}else{const o=$('#ov');o&&o.remove()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.paused&&G.state!='count')togglePause()});
document.addEventListener('keydown',e=>{if(G&&G.state=='ask'&&/^[1-4]$/.test(e.key)&&!/INPUT/.test(document.activeElement.tagName)){const i=+e.key-1;if(i<G.puz.opts.length)answer(i)}});
function speak(){if(!G||!G.puz)return;if(!('speechSynthesis' in window)){const f=$('#fb');f&&(f.textContent='Vorlesen geht in diesem Browser leider nicht.');return}
 speechSynthesis.cancel();const p=G.puz,u=new SpeechSynthesisUtterance(p.say+'. Antworten: '+p.opts.map(o=>o.l).join(', '));u.lang='de-DE';u.rate=.88;G.speaking=true;const end=()=>{G&&(G.speaking=false)};u.onend=u.onerror=end;speechSynthesis.speak(u);clearTimeout(G.spT);G.spT=setTimeout(end,15000)}
/* ---------- Ende ---------- */
function finish(){if(!G||G.over)return;G.over=true;const g=G,c=g.cfg;cancelAnimationFrame(raf);clearTimeout(g.nxT);const lostL=hasLavaOf(g)&&g.lava>=100;
 if(g.arc){const hi=g.score>(U.hi||0);if(hi)U.hi=g.score;save();const f=g.faults;stopRunKeep();show(`<div class="card c"><div class="bigE">🌋💥</div><h1>Der Vulkan ist ausgebrochen!</h1><p>Du hast <b>${g.score}</b> Punkte geschafft und bist bis Welle <b>${g.wave}</b> gekommen.</p><p>${hi?'🎉 Neuer Rekord!':'🏆 Dein Rekord: '+U.hi+' Punkte'}</p><p><button class="big" onclick="startArcade()">🔁 Nochmal</button> <button class="sec" onclick="hub()">Zum Start</button></p></div>${board()}${faultHtml(f)}`);return}
 let st=0;if(!lostL){const m=g.m;st=g.mode=='fuse'?(m<=1?3:m<=3?2:m<=5?1:0):(m<=1?3:m<=3?2:1)}
 const old=U.s[c.id]||0;if(st>old)U.s[c.id]=st;const lv=LV.find(l=>l.id==c.id);let gemNew=false;if(st>0&&lv&&!U.g[c.id]){U.g[c.id]=1;gemNew=true}save();const f=g.faults;stopRunKeep();
 const msg=lostL?'Der Vulkan ist ausgebrochen! Versuche es gleich nochmal. Du schaffst das!':st==3?'Fantastisch! Fast alles richtig!':st==2?'Sehr gut gemacht!':st==1?'Geschafft! Beim nächsten Mal geht noch mehr.':'Die Zündschnur war zu schnell. Probier es nochmal, vielleicht mit „Mehr Zeit“.';
 const idx=LV.findIndex(l=>l.id==c.id),nxt=idx>=0&&idx<LV.length-1&&(!LV[idx+1].fin||finOpen())?idx+1:-1;
 show(`<div class="card c"><div class="bigE">${lostL?'🌋💥':'🎉'}</div><h1>${lostL?'Ausbruch!':'Geschafft!'}</h1><p class="stars">${stars(st)}</p><p>${msg}</p><p>${g.right} von ${g.done} Rätseln richtig.</p>${gemNew?`<p class="gemnew">${lv.gem[0]} Du hast einen <b>${lv.gem[1]}</b> gefunden!</p>`:''}<p><button class="big" onclick="runLevel(${idx})">🔁 Nochmal</button> ${st>0&&nxt>=0?`<button class="big" onclick="intro(${nxt})">➡ Weiter</button>`:''} <button class="sec" onclick="mapScr()">🗺️ Zur Karte</button></p></div>${faultHtml(f)}`)}
const hasLavaOf=g=>g.mode=='lava'||g.mode=='both';
function stopRunKeep(){G=null;window.speechSynthesis&&speechSynthesis.cancel();lavaOff()}
const faultHtml=f=>f.length?`<details class="card"><summary>Das kannst du noch üben (${f.length})</summary><ul class="fl">${f.map(x=>`<li>${esc(x.q)}<br><b>Richtig: ${esc(x.a)}</b></li>`).join('')}</ul></details>`:'';
/* ---------- Urkunde und Ergebnisse ---------- */
function cert(){const st=sumStars(),gems=LV.filter(l=>U.g[l.id]||isAd()).map(l=>l.gem[0]).join(' ');show(`<button class="sec noprint" onclick="hub()">⬅ Zurück</button><div class="card c cert"><h1>📜 Vulkan-Urkunde</h1><p>für</p><p class="nm" id="nm">Lava-Entdecker/in</p><p class="noprint"><label>Name (wird nicht gespeichert): <input id="ni" maxlength="30" oninput="$('#nm').textContent=this.value||'Lava-Entdecker/in'"></label></p><p>hat im Vulkan <b>${st}</b> von ${LV.length*3} Sternen gesammelt${gems?` und diese Edelsteine gefunden:<br><span class="gems">${gems}</span>`:''}.</p><p>🏆 Arcade-Rekord: <b>${U.hi||0}</b> Punkte</p><p>Herzlichen Glückwunsch!</p><p class="noprint"><button class="big" onclick="window.print()">🖨️ Drucken</button></p></div>`)}
function results(){ovl(`<div class="card" style="width:min(900px,100%)"><div class="bar"><h1>📊 Ergebnisse</h1><button onclick="$('#ov').remove()">✖ Schließen</button></div>${Object.keys(DB.u).length?'':'<p>Auf diesem Gerät hat noch kein Kind gespielt.</p>'}${Object.entries(DB.u).map(([n,u])=>`<details><summary><b>${esc(n)}</b> · ⭐ ${Object.values(u.s).reduce((a,b)=>a+b,0)} von ${LV.length*3} · 🏆 ${u.hi||0} · ${u.r} von ${u.n} Rätseln richtig</summary><p>${LV.map(l=>`${l.n}: ${'⭐'.repeat(u.s[l.id]||0)||'–'}`).join('<br>')}</p>${u.f.length?`<div style="overflow-x:auto"><table><tr><th>Ort</th><th>Rätsel</th><th>Richtig wäre</th><th>Antwort des Kindes</th></tr>${u.f.map(f=>`<tr><td>${esc(f.l)}</td><td>${esc(f.q)}</td><td>${esc(f.a)}</td><td>${esc(f.g)}</td></tr>`).join('')}</table></div>`:'<p>Keine Fehler. 🎉</p>'}</details>`).join('')}<p><small>Die Daten liegen nur in diesem Browser auf diesem Gerät.</small></p><button class="sec" onclick="if(confirm('Alle Ergebnisse auf diesem Gerät löschen?')){DB.u={};save();results()}">🗑️ Alle Daten löschen</button></div>`)}
/* ---------- Glut im Hintergrund ---------- */
(()=>{const c=$('#emb'),g=c.getContext('2d'),RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;let W,H,P=[];const sz=()=>{W=c.width=innerWidth;H=c.height=innerHeight};sz();addEventListener('resize',sz);
 for(let i=0;i<46;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.4,v:12+Math.random()*30,ph:Math.random()*6});
 const draw=t=>{g.clearRect(0,0,W,H);for(const p of P){if(!RM){p.y-=p.v/60;p.x+=Math.sin(t/900+p.ph)*.35;if(p.y<-6){p.y=H+6;p.x=Math.random()*W}}g.globalAlpha=.25+.5*Math.abs(Math.sin(t/700+p.ph));g.fillStyle=p.r>2?'#ffb703':'#ff6b35';g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}RM?0:requestAnimationFrame(draw)};requestAnimationFrame(draw)})();
/* ---------- Start ---------- */
DB.cur&&DB.u[DB.cur]?login(DB.cur):(U=mkU(),hub(),ask());

</script></body></html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strand-Mathe – Klasse 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:20px/1.45 ui-rounded,"Nunito","Varela Round","Quicksand","Arial Rounded MT Bold","Segoe UI","Trebuchet MS",system-ui,sans-serif;background:#0a4f6b;color:#fff;min-height:100vh}
main{max-width:880px;margin:auto;padding:12px}
h1,h2{margin:.3em 0}h2{font-size:1.25em}
.card{background:#fff;color:#1b1464;border:4px solid #ffd23f;border-radius:26px;padding:16px;margin:12px 0;box-shadow:0 7px 0 #0005}
.c{text-align:center}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-weight:bold;min-height:52px;min-width:52px;padding:8px 18px;margin:3px;border:3px solid #1b1464;border-radius:18px;background:#ffd23f;color:#1b1464;cursor:pointer;box-shadow:0 4px 0 #1b1464}
button:hover{background:#ffe680}button:disabled{opacity:.75;cursor:default}
button:focus-visible,input:focus-visible{outline:5px solid #ff4d6d;outline-offset:2px}
.sec{background:#e8e6ff}.big{font-size:1.2em;padding:12px 24px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}.opts.n4{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}.opt{min-width:0;overflow-wrap:anywhere;hyphens:auto;line-height:1.25}
.opt{font-size:1.1em}.good{background:#7ae582!important}
input{font:inherit;padding:10px;border:3px solid #1b1464;border-radius:14px;min-height:52px;width:200px;max-width:100%;margin:3px}
.tx{background:#e3f1ff;color:#0f2a5c;border-radius:14px;padding:10px 12px;border:2px solid #7fb4f5;border-left:8px solid #2f7de1}details.tx{margin:10px 0;box-shadow:0 3px 0 #2f7de1}details.tx[open]{background:#d4e9ff}details.tx summary{cursor:pointer;font-weight:800;color:#0b3a8a;min-height:44px;display:flex;align-items:center;gap:6px}details.tx summary:hover{color:#1d5fc4}details.tx p{margin:6px 0 0}
.prog{height:18px;background:#ffffff44;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:#ffd23f}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.pool,.bkt{min-height:64px;border:3px dashed #1b1464;border-radius:16px;padding:6px;margin:6px 0}
.bkt{background:#eefaff}.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.chip{background:#c9f0ff}.chip.on{background:#ff8fa3;outline:4px solid #1b1464}
#fb{font-weight:bold;min-height:1.5em}li{text-align:left;margin:4px 0}ul{list-style:none;padding:0}
.nm{font-size:1.8em;font-weight:bold}
.sys{container-type:inline-size;position:relative;width:min(100%,700px);aspect-ratio:1;margin:8px auto}
.orb{pointer-events:none;position:absolute;left:50%;top:50%;border:3px dashed #ffffff44;border-radius:50%;transform:translate(-50%,-50%)}
.o0{width:42%;height:42%}.o1{width:64%;height:64%}.o2{width:86%;height:86%}
.pw{position:absolute;left:50%;top:50%;width:14%;transform:translate(-50%,-50%)}
.pb{pointer-events:auto;display:block;width:100%;min-width:0;min-height:0;padding:0;margin:0;background:none;border:0;box-shadow:none;color:#fff;border-radius:50%}
.gw{display:block}.pic{display:grid;place-items:center;width:100%;aspect-ratio:1;container-type:inline-size}
.pic svg{display:block;width:100%;height:100%}.emo{font-size:85cqw;line-height:1}
.lb{position:absolute;left:50%;top:50%;z-index:8;pointer-events:none;white-space:nowrap;font-weight:bold;font-size:max(11px,2.5cqw);color:#fff;text-shadow:0 0 4px #000,0 2px 2px #000;transform:translate(-50%,0);transform-origin:50% 0;transition:transform .45s cubic-bezier(.2,.9,.25,1.25)}
.sun{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);min-width:0;min-height:0;padding:0;margin:0;border:0;border-radius:50%;background:none;box-shadow:none;color:#fff;filter:drop-shadow(0 0 14px #ffb703);display:flex;flex-direction:column;align-items:center;justify-content:center}
.se{font-size:11cqw;line-height:1}.sl{font-size:max(10px,2.2cqw);line-height:1.15;font-weight:bold;text-align:center;text-shadow:0 0 4px #000,0 2px 2px #000}
.pb:hover,.pb:focus-visible{background:none}.pb:focus-visible{outline:none}
.gw{position:relative;isolation:isolate;border-radius:50%;transition:transform .45s cubic-bezier(.2,.9,.25,1.25)}
.gw::before,.gw::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s}
.gw::before{inset:-50%;background:radial-gradient(circle closest-side,var(--gc,#ffd23f) 0,var(--gc,#ffd23f) 48%,transparent 100%)}
.gw::after{inset:-85%;background:repeating-conic-gradient(rgba(255,255,255,.9) 0 5deg,transparent 5deg 30deg);-webkit-mask:radial-gradient(circle closest-side,transparent 34%,#000 44%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 34%,#000 44%,transparent 100%)}
.pb:hover .gw,.pb.hot .gw,.pb:focus-visible .gw{transform:scale(1.5)}
.pb:hover .gw::before,.pb.hot .gw::before,.pb:focus-visible .gw::before{opacity:.85}
.pb:hover .gw::after,.pb.hot .gw::after,.pb:focus-visible .gw::after{opacity:.75;animation:rot 16s linear infinite}
.pb:focus-visible .gw{box-shadow:0 0 0 .6cqw #ff4d6d}
.lb.hot{transform:translate(-50%,3.4cqw) scale(1.2)}
.pw.hot{z-index:3}

@media(prefers-reduced-motion:reduce){.gw::after{animation:none!important}}



.bigpl{width:150px;margin:8px auto}
.mapg{display:grid;gap:6px 16px;grid-template-areas:"user" "ttl" "hint" "sys" "lk" "right"}
.mapg .usr{grid-area:user;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-weight:bold}
.mapg .usr button{min-height:40px;padding:4px 14px;font-size:.8em;margin:0}
.mapg .ttl{grid-area:ttl;position:relative;z-index:9}.mapg .hint{grid-area:hint;margin:4px 0;text-align:center}.mapg .sys{grid-area:sys;width:min(100%,700px)}.mapg #lk{grid-area:lk;margin:4px 0}.mapg .rt{grid-area:right}
@media(min-width:1000px){.mapg{position:relative;left:50%;transform:translateX(-50%);width:min(1240px,calc(100vw - 48px));grid-template-columns:270px minmax(0,1fr) 270px;grid-template-rows:auto auto 1fr auto;grid-template-areas:"ttl ttl ttl" "user sys right" "hint sys right" ". lk ." ;align-items:start;gap:0 20px}
 .mapg .sys{width:min(100%,calc(100vh - 180px),760px);width:min(100%,calc(100dvh - 180px),760px);min-width:380px;justify-self:center;margin:22px auto 0}
 .mapg .usr{flex-direction:column;align-items:stretch;text-align:center;gap:8px;padding:14px 16px;margin-top:10px;border-radius:22px;background:linear-gradient(135deg,#ffffff24,#ffffff0a);border:1px solid #ffffff3d;box-shadow:0 10px 30px #0006}
 .mapg .usr button{font-size:.9em}
 .mapg .hint{text-align:left;font-size:.9em;opacity:.9;padding:10px 6px}
 .mapg .rt{margin-top:10px}.mapg .rk{max-width:none;margin:0 0 14px}}
.ttl{text-align:center;font:900 min(2.3em,8.4vw)/1.1 "Baloo 2","Fredoka","Arial Rounded MT Bold","Avenir Next Rounded","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;letter-spacing:.03em;margin:.4em 0 .2em;color:#ffe566;text-shadow:0 2px 0 #c77700,0 0 8px #ffb703,0 0 22px #ff9f1c,0 0 40px #ff9f1c88}
#ov{position:fixed;inset:0;z-index:20;background:#08405aee;display:grid;place-items:start center;padding:12px;overflow:auto}
#ab{position:fixed;right:12px;bottom:12px;z-index:10;background:#fff}
.sun.l{filter:grayscale(.7) drop-shadow(0 0 6px #fff6)}
table{border-collapse:collapse;width:100%;font-size:.8em}td,th{border:1px solid #1b1464;padding:4px;text-align:left}details{margin:8px 0}summary{cursor:pointer;min-height:44px}
/* Raketenkasten */
.rk{display:flex;align-items:center;gap:16px;max-width:400px;margin:14px auto;padding:12px 18px;border-radius:22px;background:linear-gradient(135deg,#ffffff24,#ffffff0a);border:1px solid #ffffff3d;box-shadow:0 10px 30px #0006;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rkm{flex:none;width:58px}.rkm svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 8px #ffc85059)}
.rkt{display:flex;flex-direction:column;gap:5px;font-size:.85em;line-height:1.3;min-width:0}.rkt b:first-child{font-size:1.2em}.rkt small{opacity:.75}
.nw{white-space:nowrap}.seg{display:flex;gap:4px}.seg i{flex:1;height:7px;border-radius:4px;background:#ffffff2e}.seg i.on{background:linear-gradient(90deg,#ffd23f,#ff9f1c);box-shadow:0 0 8px #ffb703aa}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:fl .45s ease-in-out infinite alternate}
@keyframes fl{to{transform:scaleY(1.14) scaleX(.94)}}
.cs{display:block;width:96px;margin:6px auto}.cs svg{display:block;width:100%;height:auto}
/* Pop-up: neues Raketenteil */
#pop{position:fixed;inset:0;z-index:30;background:#052f45e6;display:grid;place-items:center;padding:16px;overflow:auto}
.pbox{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(420px,100%);text-align:center}
.stage{position:relative;width:min(300px,76vw);aspect-ratio:1;display:grid;place-items:center}
.rays{position:absolute;inset:-22%;background:repeating-conic-gradient(from 0deg,#ffe27a 0 6deg,#ffe27a00 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 6%,#0000 66%);mask:radial-gradient(circle,#000 6%,#0000 66%);animation:rot 16s linear infinite}
.halo{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,#ffd23fcc,#ffd23f00 70%)}
.pp{position:relative;width:54%;animation:pin .7s cubic-bezier(.2,1.4,.4,1) both}.pp svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px #0008)}
.pt{font-size:1.25em;font-weight:bold;line-height:1.3;margin:4px 0 8px}.pt b{color:#ffe566}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pin{0%{transform:scale(.15) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.rays,.pp,.flame{animation:none}}
/* Neue Aufgabenformate */
button:disabled.dn,button:disabled.good{opacity:1}
.insr{font-size:1.05em;line-height:2.9;margin:6px 0}.insr input{width:84px;line-height:1.2;margin:0 4px;vertical-align:middle}
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-height:68px;border:3px solid #1b1464;border-radius:16px;padding:6px;margin:6px 0;background:#f4f2ff}
.chip.sel{background:#ffd23f}.chip b{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;border-radius:50%;background:#1b1464;color:#fff;font-size:.8em;margin-right:4px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}.imgs.clocks{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.im{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:92px;margin:0;padding:6px 4px;background:#fff;font-size:.9em;min-width:0}.im .n{font-size:.82em;line-height:1.15;text-align:center;overflow-wrap:anywhere;hyphens:auto;max-width:100%}.im svg{max-width:100%;height:auto}.im .e{font-size:2.2em;line-height:1.1;display:block}.im.txt .n{font-size:1.1em}
.im[aria-pressed=true]{background:#ffd23f;outline:4px solid #1b1464}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.mcd{min-height:82px;margin:0;padding:6px;background:#6c63ff;color:#fff;font-size:.95em;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}.mcd.up{background:#fff;color:#1b1464}.mcd.dn{background:#7ae582;color:#1b1464}
.mat{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mat>div{display:flex;flex-direction:column;gap:4px}.mt{margin:0;font-size:.9em;line-height:1.2;overflow-wrap:anywhere;background:#fff}.mt.on{background:#ff8fa3;outline:4px solid #1b1464}.mt.dn{background:#7ae582}
@media print{body{background:#fff}.noprint,#pop{display:none!important}.card{box-shadow:none}}
@keyframes wxo{to{opacity:0;transform:scale(1.6)}}#wx{position:fixed;inset:0;z-index:200;pointer-events:none;background:radial-gradient(circle,#fff 0,#d9f6ff 35%,#0a6f8f 100%);animation:wxo .9s ease-out forwards}
/* ===== Strand ===== */
.jbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slots{display:flex;gap:2px;flex-wrap:nowrap}.sl1{font-size:1.45em;line-height:1.1;filter:brightness(0) opacity(.28)}.sl1.on{filter:none;text-shadow:0 0 10px #ffd23f}
.slots.lt .sl1{filter:brightness(0) opacity(.12)}.slots.lt .sl1.on{filter:none;text-shadow:none}
.pp.art{font-size:min(34vw,140px);line-height:1;width:auto}
.cslots{display:block;margin:6px auto;text-align:center}.cslots .slots{justify-content:center}.cslots .sl1{font-size:2.2em}
.imgs.g3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:420px;margin:0 auto}
.imgs.g3 .im{min-height:84px}
.imgs.w3{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.gm{display:grid;grid-template-columns:repeat(3,minmax(0,100px));gap:4px;justify-content:center;margin:8px auto}.gm div{background:#eaf6e6;border:2px solid #1b1464;border-radius:12px;padding:4px 2px;text-align:center;font-size:.72em;overflow-wrap:anywhere;hyphens:auto;min-width:0;line-height:1.15;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center}.gm div b{font-size:1.9em;font-weight:400;line-height:1.1}
.cmp{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800;margin:4px 0}.cmp span{font-size:1.4em;background:#1b1464;color:#fff;border-radius:50%;width:2em;height:2em;display:grid;place-items:center}
.vsvg{display:block;margin:6px auto;max-width:100%;height:auto}
.tl{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.mat{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}.mt{padding:6px 8px;hyphens:auto}
h2,.tx,.card p{overflow-wrap:anywhere;hyphens:auto}

/* ---- Dschungelszene: Tiere und Dinge direkt auf der Karte ---- */
.jm{border-radius:28px;box-shadow:0 10px 30px #0008,inset 0 0 0 3px #ffffff55;overflow:hidden;background:#f6e6b4}
.jm .pw{width:22%}
.jm .pb{display:flex;flex-direction:column;align-items:center;padding:2.6cqw 0 0;cursor:pointer}
.st{position:relative;display:block;line-height:1}
.sd{position:absolute;left:50%;bottom:-4%;width:78%;height:16%;transform:translateX(-50%);background:radial-gradient(closest-side,#000a,#0000)}
.an{position:relative;display:block;font-size:10.5cqw;line-height:1;transform-origin:50% 100%;animation:idle 3.4s ease-in-out infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 3px 2px #0006)}
@keyframes idle{50%{transform:translateY(-3%) scale(1.02)}}
.pb:hover .an,.pb.hot .an,.pb:focus-visible .an,.jt:hover .an,.jt:focus-visible .an{animation:var(--an,hop) .8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.12,.9)}30%{transform:translateY(-26%) scale(.96,1.1)}60%{transform:translateY(-26%) rotate(-7deg)}85%{transform:translateY(0) scale(1.14,.88)}}
@keyframes flap{0%,100%{transform:translateY(0) rotate(0) scale(1.12)}25%{transform:translateY(-18%) rotate(-15deg) scale(1.14)}75%{transform:translateY(-18%) rotate(15deg) scale(1.14)}}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(0) scale(1.12)}20%{transform:translate(12%,-16%) rotate(14deg)}50%{transform:translate(-12%,-22%) rotate(-14deg)}80%{transform:translate(9%,-9%) rotate(9deg)}}
@keyframes nod{0%,100%{transform:rotate(0) scale(1.12)}50%{transform:translateY(-14%) rotate(9deg) scale(1.16)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-7deg) scale(1.12)}50%{transform:translateY(-12%) rotate(7deg) scale(1.12)}}
@keyframes wobble{0%,100%{transform:rotate(-16deg) scale(1.14)}50%{transform:rotate(16deg) translateY(-9%) scale(1.14)}}
.sg{position:relative;display:block;margin-top:1cqw;padding:.5cqw 1.8cqw;background:linear-gradient(176deg,#e9cf9b,#d2a96a 55%,#c49457);border:2px solid #8a5d2e;border-radius:6px 9px 7px 10px/9px 6px 10px 7px;color:#4a2a0e;font-weight:800;font-size:max(11px,2.05cqw);line-height:1.2;text-align:center;box-shadow:0 2px 0 #5c3a1a,0 5px 8px #5c3a1a66;white-space:nowrap;text-shadow:0 1px 0 #f3e2b8}
.sg::before,.sg::after{content:"";position:absolute;top:50%;width:.55em;height:.55em;margin-top:-.28em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8a58a,#5c3a1a);opacity:.85}.sg::before{left:.35em}.sg::after{right:.35em}
.sg small{display:block;font-weight:700;font-size:.82em;color:#6b3f12}
.pb:hover .sg,.pb.hot .sg,.pb:focus-visible .sg,.jt:hover .sg{background:linear-gradient(176deg,#f6e2b0,#e1b97a 55%,#d2a266)}
.pb:focus-visible .st,.jt:focus-visible .st{outline:4px solid #ff4d6d;outline-offset:6px;border-radius:12px}
.jm .sun{left:50%;top:15%;width:24%;aspect-ratio:auto;min-height:0;padding:2.4cqw 0 0;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 0 12px #ffd23f);animation:lt 3s ease-in-out infinite}
@keyframes lt{50%{filter:drop-shadow(0 0 22px #fff3a0)}}
.jm .sun.l{filter:drop-shadow(0 0 6px #fff5);animation:none}
.jm .sun .an{font-size:12cqw}
.lk{position:absolute;right:-6%;bottom:-6%;font-size:7cqw;filter:drop-shadow(0 2px 2px #000a)}
.dc{position:absolute;line-height:1;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--r,0deg));animation:sway 5.5s ease-in-out infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 2px 2px #0005)}
@keyframes sway{50%{transform:translate(-50%,-50%) rotate(calc(var(--r,0deg) + 5deg))}}
.dc.fg{z-index:6}
.bigpl .emo{display:block;animation:idle 3s ease-in-out infinite;transform-origin:50% 100%}
@media(prefers-reduced-motion:reduce){.an,.dc,.bigpl .emo{animation:none!important}.pb:hover .an,.pb:focus-visible .an,.jt:hover .an{transform:scale(1.15)}}
.kmap{position:relative;width:min(100%,460px);aspect-ratio:100/108;margin:8px auto;border:3px solid #1b1464;border-radius:14px;overflow:hidden;background:#d4ebbb;container-type:inline-size}
.kmap>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.kmap .mp,.kmap .pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;margin:0;min-height:0;min-width:0;width:auto;max-width:36%;padding:2px 3px 3px;border-radius:12px;line-height:1.05;background:#fffdf0f2;border:2px solid #1b1464;box-shadow:0 2px 0 #1b146455;color:#1b1464}
.kmap .pin{font-style:normal}.kmap .pin .n{font-style:normal}
.kmap .e{font-size:clamp(20px,8.4cqw,38px);line-height:1.1}
.kmap .n{font-size:clamp(9px,3.1cqw,15px);font-weight:800;line-height:1.1;overflow-wrap:anywhere;hyphens:auto}
.kmap .mp:hover{transform:translate(-50%,-50%) scale(1.06)}
.kmap .im[aria-pressed=true]{background:#ffd23f;outline:4px solid #1b1464}

/* Fortschrittsring an den Stationen */
.jm .st .ring{position:absolute;left:50%;top:48%;width:158%;aspect-ratio:1;transform:translate(-50%,-50%);overflow:visible;pointer-events:none}
.ring .rg{fill:none;stroke:#0b5a7a;stroke-width:7.5;stroke-linecap:round;opacity:.5}
.ring .rg.on{stroke:#ff9f1c;stroke-width:9;opacity:1}
.ring .rg:not(.on){stroke:#fff;opacity:.85;stroke-width:6}
.ring.full .rg{stroke:#ffb400;stroke-width:10}
.jm .pb .sg{position:relative;z-index:3}
.jm .ok{position:absolute;right:-22%;top:-8%;width:5.2cqw;height:5.2cqw;min-width:20px;min-height:20px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff6b8,#ffd23f 60%,#e69a00);border:2px solid #1b1464;color:#1b1464;font-weight:900;font-size:max(12px,3.2cqw);line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #1b1464}

.sandbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wv{animation:wv 7s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(-2.2px)}}
@media(prefers-reduced-motion:reduce){.wv,.jm .sun{animation:none!important}}
.jm .dc{filter:drop-shadow(0 2px 2px #0004)}

/* ---- Ziffernblock ---- */
.np{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:264px;margin:10px auto 4px}
.np .nk{margin:0;min-height:56px;font-size:1.5em;padding:4px;background:#eaf7ff}.np .nk.sec{background:#ffe0e6}
.np span{display:block}
#in,.ins{text-align:center;font-weight:800;font-size:1.3em;caret-color:#1b1464}
#in{width:min(100%,220px)}

<script>
const $=s=>document.querySelector(s),M=$('main');
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>[...a].sort(()=>Math.random()-.5),pk=a=>a[R(0,a.length-1)];
/* Aufgabenformate: mc = Auswahl, in = Eingabe, ins = mehrere Lücken, dd = Sortieren, ord = Reihenfolge, img = Felder anklicken, mem = Memo, mat = Zuordnen */
const MC=(q,a,w,h,x={})=>({t:'mc',q,a:String(a),o:[a,...w].map(String),h,...x});
const IN=(q,a,h,x={})=>({t:'in',q,a:String(a),h,...x});
const DD=(q,b,it,h,x={})=>({t:'dd',q,b,it,h,...x});
const INS=(q,parts,h,x={})=>({t:'ins',q,parts,ans:parts.filter(p=>typeof p!='string').map(p=>String(p.a)),h,...x});
const ORD=(q,s,h,x={})=>({t:'ord',q,s,it:[...s],h,...x});

 ch.forEach(([A,B])=>{const out=(A[0]+B[0])/2<50?-1:1,mx=(A[0]+B[0])/2+out*7,my=(A[1]+B[1])/2;s+=`<path d="M${A[0]} ${A[1]+4}Q${f(mx)} ${f(my+3)} ${B[0]} ${B[1]+2}" fill="none" stroke="#e9d49a" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2.2 2.6" opacity=".6"/>`});

<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sportfest · Klasse 1</title>
<style>
:root{--ink:#17202e;--mut:#5b6b80;--cy:#0fb5e8;--bl:#3a68ff;--vi:#8a5cf6;--ok:#0f9d63;--no:#d93a43;--line:#c9d3e0;--bg1:#ffffff;--bg2:#e9eff7;--ch:linear-gradient(180deg,#fff 0,#f1f4f9 46%,#d3dbe7 54%,#eef2f8 100%)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:600 18px/1.45 "Avenir Next","Segoe UI Variable Display","Segoe UI","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(900px 520px at 12% -8%,#ffffff 0,transparent 62%),radial-gradient(800px 520px at 100% 0,#dff3ff 0,transparent 60%),linear-gradient(180deg,#f4f7fb,#e3eaf4 70%,#d8e1ee);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(58,104,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(58,104,255,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%)}
#emb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:12px 16px 56px}
#app.wide{max-width:980px}
h1,h2{font-weight:800;letter-spacing:.02em;color:var(--ink)}
h1{font-size:1.5em;margin:.3em 0;line-height:1.15}h2{font-size:1.15em;margin:.3em 0}
p{margin:.55em 0}
.c{text-align:center}.mini,small{color:var(--mut);font-size:.85em;font-weight:600}small{display:block}
.card{position:relative;background:linear-gradient(165deg,rgba(255,255,255,.96),rgba(240,245,251,.9));border:1px solid #fff;border-radius:26px;padding:16px 18px;margin:14px 0;box-shadow:0 0 0 1px var(--line),inset 0 2px 0 #fff,0 18px 40px rgba(40,70,120,.16)}
button,.lnk{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:16px;min-height:48px;padding:.55em 1.1em;color:var(--ink);text-decoration:none;display:inline-block;background:var(--ch);box-shadow:inset 0 1px 0 #fff,0 0 0 1px #bcc8d8,0 4px 0 #aab8cb,0 10px 16px rgba(40,70,120,.15);transition:transform .12s,box-shadow .12s,filter .15s;-webkit-tap-highlight-color:transparent}
button:hover:not(:disabled){filter:brightness(1.04)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 #fff,0 0 0 1px #bcc8d8,0 1px 0 #aab8cb,0 3px 8px rgba(40,70,120,.15)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.lnk:focus-visible,input:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:4px solid var(--cy);outline-offset:3px}
button[aria-pressed=true]{background:linear-gradient(180deg,#c9f0ff,#7fd4f5);box-shadow:inset 0 1px 0 #fff,0 0 0 2px var(--cy),0 4px 0 #3aa2cc}
.big{background:linear-gradient(180deg,#5fd4ff,#1b8fe6 55%,#3a68ff);color:#fff;text-shadow:0 1px 0 rgba(0,0,40,.25);font-size:1.08em;padding:.7em 1.4em;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 0 0 1px #2a63c9,0 6px 0 #1f4aa6,0 14px 24px rgba(58,104,255,.28);margin:.2em}
.big:active:not(:disabled){box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 0 0 1px #2a63c9,0 2px 0 #1f4aa6,0 6px 12px rgba(58,104,255,.28)}
.sm{min-height:44px;padding:.35em .85em;font-size:.9em}
.sec{background:linear-gradient(180deg,#fff,#e6ecf5)}
.back{background:linear-gradient(180deg,#fff,#e9eef6)}
input[type=text],input:not([type]){font:inherit;font-weight:700;padding:.65em .9em;border-radius:16px;border:2px solid #b9c6d8;background:#fff;color:var(--ink);width:min(320px,100%);text-align:center;box-shadow:inset 0 2px 5px rgba(40,70,120,.12)}
#ue{color:var(--no);min-height:1.4em}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}.bar h1{margin:0;font-size:1.3em}
/* Hub */
.logo{text-align:center;margin:2px 0 0}
.logo span{display:block;font:800 2.5em/1.05 "Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(180deg,#2b3a52 0,#8c9db5 48%,#1b2536 52%,#5a6d88 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 8px 10px rgba(40,70,120,.25))}
.logo small{color:var(--mut);font-size:.95em;margin-top:2px;letter-spacing:.04em}
.scene{display:block;width:100%;height:auto;max-width:540px;margin:8px auto;border-radius:30px;box-shadow:0 0 0 1px #fff,0 0 0 2px var(--line),0 24px 50px rgba(40,70,120,.28);background:#eaf1f9;touch-action:manipulation;overflow:hidden}
.scene [role=button]{cursor:pointer;outline:none}
.scene .px{transition:transform .25s ease-out;will-change:transform}
.scene .hl{fill:rgba(15,181,232,0);stroke:rgba(15,181,232,0);stroke-width:3;transition:.25s}
.scene [role=button]:hover .hl,.scene [role=button]:focus-visible .hl{fill:rgba(15,181,232,.07);stroke:rgba(15,181,232,.95)}
.bd{transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}
.scene [role=button]:hover .bd,.scene [role=button]:focus-visible .bd{transform:translateY(-4px) scale(1.02)}
.fl1{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.fl2{animation:fl 8s ease-in-out -3s infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(2deg)}}
.spin{animation:sp 40s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
.tw{animation:tw 3.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.55}}
.drift{animation:dr 12s linear infinite;opacity:0}@keyframes dr{0%{transform:translateY(30px);opacity:0}15%{opacity:.8}85%{opacity:.6}100%{transform:translateY(-120px);opacity:0}}
.pn{font:800 13.5px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#17202e;text-anchor:start;letter-spacing:.02em}
.ps{font:700 10.5px "Avenir Next","Segoe UI",system-ui,sans-serif;fill:#5b6b80;text-anchor:start}
.prog{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}
.prog span{background:linear-gradient(180deg,#fff,#e9eff7);border:1px solid #fff;box-shadow:0 0 0 1px var(--line);border-radius:20px;padding:.2em .9em;font-size:.95em;font-weight:800}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0}
.tools>*{min-width:82px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45em .6em;font-size:.82em;line-height:1.1}
.tools>*>span{font-size:1.6em;line-height:1}
/* Lernpfad: Module */
.hdr{display:flex;align-items:center;gap:14px;margin:6px 0 10px}.hdr .ico{font-size:2.4em;filter:drop-shadow(0 6px 6px rgba(40,70,120,.3))}
.tix{list-style:none;margin:8px 0 16px;padding:0;display:grid;gap:12px}
.tk{margin:0}
.tkb{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:.6em .9em;border-radius:22px;min-height:76px}
.tke{flex:none;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7em;background:radial-gradient(circle at 32% 26%,#fff 0,#dfe7f2 55%,#b9c6d8 100%);box-shadow:inset 0 -4px 8px rgba(40,70,120,.18),0 4px 8px rgba(40,70,120,.2)}
.tkt{flex:1;min-width:0;display:flex;flex-direction:column}.tkt b{font-size:1.08em;font-weight:800}
.tks{flex:none;letter-spacing:.05em;font-size:1em}
.tk.lk .tkb{opacity:.6}
.tk.dn .tke{background:radial-gradient(circle at 32% 26%,#fff 0,#bfeeff 55%,#6fcdf0 100%)}
/* Aufgaben */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(180deg,#fff,#eaf0f8);border:1px solid #fff;box-shadow:0 0 0 1px var(--line);border-radius:22px;padding:6px 8px}
.hud .ttl{flex:1;min-width:0;text-align:center;overflow-wrap:anywhere;line-height:1.15;font-weight:800}
.pbar{display:flex;gap:5px;margin:10px 4px}.pbar i{flex:1;height:10px;border-radius:8px;background:#d3dce8;box-shadow:inset 0 2px 3px rgba(40,70,120,.25);transition:.3s}
.pbar i.g{background:linear-gradient(180deg,#7ff0bb,#18b878);box-shadow:0 0 10px rgba(24,184,120,.45)}.pbar i.r{background:linear-gradient(180deg,#ffc7b8,#ff8a6b)}.pbar i.l{background:linear-gradient(180deg,#d9e4ff,#8fa9ff)}.pbar i.c{background:linear-gradient(180deg,#9fe6ff,#2bb6ee);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.2)}}
.q{font-size:1.28em;font-weight:800;text-align:center;margin:.2em 0 .6em;line-height:1.28}
.vis{text-align:center;margin:.3em 0 .7em}
.vis svg{max-width:100%;height:auto;border-radius:18px;box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(40,70,120,.15);background:#fff}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.c1{grid-template-columns:1fr}.opts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.o{min-width:0;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;min-height:70px;font-size:1.1em;font-weight:800;color:var(--ink);padding:.45em .55em;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;text-align:center;line-height:1.2;border-radius:20px}
.o.ok{background:linear-gradient(180deg,#d6ffe9,#7fe6b4);color:#063b22;animation:pop .45s}.o.no{background:linear-gradient(180deg,#ffe0dc,#ffa59b);color:#5a1510;opacity:.85;animation:shake .4s}
.o:disabled{opacity:1}.o.no:disabled{opacity:.7}
@keyframes pop{40%{transform:scale(1.07)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.o svg{max-width:100%;height:auto;border-radius:10px}
.fbk{min-height:2.6em;text-align:center;font-weight:800;margin:.6em 0}
.fbk.ok{color:var(--ok)}.fbk.no{color:var(--no)}
.fun{background:linear-gradient(180deg,#eefaff,#dff2fb);border-left:5px solid var(--cy);border-radius:12px;padding:.55em .9em;margin:.5em 0;text-align:left;font-weight:600}
.say{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
.learn{text-align:left}.learn .q{text-align:left}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:10px 0}
.fgrid>div{background:linear-gradient(180deg,#fff,#eef3f9);border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:8px;text-align:center;font-weight:800;font-size:.92em}
.fgrid svg{width:100%;max-width:110px;height:auto;display:block;margin:0 auto 4px;background:none;box-shadow:none}
/* Einsortieren, Reihenfolge, Paare */
.bins{display:grid;grid-template-columns:repeat(var(--nb,2),minmax(0,1fr));gap:10px;margin:8px 0}
.bin{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-height:110px;padding:.5em;gap:6px;font-size:.95em;border-radius:20px;background:linear-gradient(180deg,#f3f7fc,#dfe7f2);box-shadow:inset 0 3px 8px rgba(40,70,120,.18),0 0 0 1px #bcc8d8}
.bin.hint{outline:4px solid #ffc83d}.bin.no{animation:shake .4s}
.bin-in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.plc{background:#fff;border-radius:12px;padding:3px 8px;box-shadow:0 0 0 1px var(--line);font-size:.95em}.plc svg{width:44px;height:auto;display:block;box-shadow:none;background:none}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.chw{display:inline-flex;gap:4px;align-items:center}
.chp{min-height:52px;padding:.3em .8em;border-radius:16px;font-size:1em}.chp svg{width:46px;height:auto;display:block;background:none;box-shadow:none}
.chp.sel{outline:4px solid var(--cy)}.chp.no{animation:shake .4s}.chp.hint{outline:4px solid #ffc83d}.chp.drag{opacity:.9;box-shadow:0 12px 24px rgba(40,70,120,.4)}.chp.ph{min-height:44px;padding:.2em .5em}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.slot{min-width:64px;min-height:56px;padding:4px 8px;border-radius:14px;border:2px dashed #9fb0c6;display:flex;align-items:center;justify-content:center;gap:4px;position:relative;background:#f4f7fb}
.slot i{position:absolute;left:5px;top:1px;font:800 .7em system-ui;color:var(--mut);font-style:normal}.slot.fil{border-style:solid;border-color:var(--ok);background:#e5fff2}.slot svg{width:44px;height:auto;display:block;background:none;box-shadow:none}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}.pcol{display:flex;flex-direction:column;gap:10px}
.pr{min-height:66px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:.98em;line-height:1.15;border-radius:18px}.pr svg{max-width:84px;height:auto;display:block;background:none;box-shadow:none}
.pr.sel{outline:4px solid var(--cy)}.pr.ok{background:linear-gradient(180deg,#d6ffe9,#7fe6b4)}.pr.no{animation:shake .4s}.pr:disabled{opacity:1}
/* Tangram */
.tgw{margin:6px 0}
.tgs{display:block;width:100%;height:auto;border-radius:20px;background:linear-gradient(180deg,#fbfdff,#e9f0f8);box-shadow:0 0 0 1px var(--line),inset 0 2px 0 #fff;touch-action:none;user-select:none;-webkit-user-select:none}
.tgs .pc{cursor:grab}.tgs .pc.sel path.pp{stroke:#0a74c9;stroke-width:.07}
.tgs .pc.hl path.pp{animation:pulse2 1s ease-in-out infinite}
@keyframes pulse2{50%{filter:brightness(1.35) drop-shadow(0 0 .25px #0fb5e8)}}
.tgs .slotpulse{animation:tw 1s ease-in-out infinite}
.tgb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tgb button{min-height:50px;min-width:50px;padding:.3em .7em;font-size:.95em}
.tgb button span{font-size:1.25em}
/* Geobrett */
.gbs{display:block;width:100%;height:auto;max-width:460px;margin:4px auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;border-radius:20px;background:linear-gradient(180deg,#fff,#e9f0f8);box-shadow:0 0 0 1px var(--line)}
.gbs .peg{cursor:pointer}svg [role=button],svg [tabindex]{outline:none!important}.gbs .peg:focus-visible circle.pr2{fill:#0fb5e8;stroke:#0a74c9;stroke-width:.08}.gbs .peg:focus-visible circle.pr2{r:.22}.tgs .pc:focus-visible path.pp{stroke:#0a74c9;stroke-width:.14}
.tool{margin:8px auto 2px;max-width:460px;text-align:center}.tool label{display:block;font-weight:700;color:var(--mut);font-size:.95em;margin-bottom:8px}.trow{display:flex;gap:12px;align-items:center;justify-content:center}.trow button{flex:none;white-space:nowrap;min-height:44px;padding:.4em .8em}.trow input[type=range]{flex:1 1 200px;min-width:0;height:36px;accent-color:#0fb5e8}.trow input[type=range]:focus-visible{outline:4px solid var(--cy);outline-offset:3px}#tsv svg{display:block;margin:0 auto}
.gbrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.gbcol{flex:1 1 200px;min-width:0;text-align:center;font-size:.85em;color:var(--mut)}
/* Würfelgebäude */
.cbw{display:flex;flex-direction:column;gap:6px}
.cbb{display:flex;flex-direction:column;align-items:center}
.cbg{display:grid;gap:8px;justify-content:center;margin:6px auto}
.cbc{position:relative;transition:box-shadow .15s,background .15s}
.cbc .cbn{font:800 .72em system-ui;color:var(--mut);line-height:1;margin-top:1px}
.cbc.sel{background:linear-gradient(180deg,#fff4df,#ffe2b0);box-shadow:0 0 0 3px #ff9f1c,0 4px 12px rgba(255,159,28,.35)}
.cbc.sel .cbn{color:#a85a00}
.front.fr{width:100%;max-width:var(--cbw,300px);background:#e3f5ec;color:#1f6b49;font-weight:800;border-radius:8px;padding:2px 0;box-shadow:inset 0 -3px 0 #2f9e6b}
.cbl{margin-top:2px}
.rv{display:flex;flex-direction:column;align-items:center;gap:4px}
.rvs{display:block;width:100%;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;border-radius:18px}
.rvs.grab{cursor:grabbing}
.rvs:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
.rvs svg{pointer-events:none;display:block;margin:0 auto}
.rvc{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:2px}
.rvc button{min-height:44px;min-width:44px;padding:.3em .8em;font-size:.95em}
.rvh{color:var(--mut);font-size:.8em}
.cvhint{animation:cvfade 6s ease-in 0s 1 forwards}
@keyframes cvfade{0%,40%{opacity:1}100%{opacity:0}}
.cvb{display:block;margin:6px auto 0;min-height:44px;padding:.35em .9em;font-size:.9em}
.cbw2{display:flex;flex-direction:column;gap:10px}
.cbw2 .vis{margin:.2em 0}
.cap{display:block;font-weight:800;font-size:.85em;color:var(--mut);margin:0 0 4px}
.cbtool{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 6px}
.cbtool button{min-height:44px;padding:.35em .9em;font-size:.95em}
.cbtool button[aria-pressed=true]{background:linear-gradient(180deg,#ffe8bf,#ffc56e);box-shadow:inset 0 1px 0 #fff,0 0 0 2px #ff9f1c,0 4px 0 #d98200,0 8px 14px rgba(255,159,28,.3)}
#cbm_rm[aria-pressed=true]{background:linear-gradient(180deg,#ffd9d6,#ff9d96);box-shadow:inset 0 1px 0 #fff,0 0 0 2px #d63031,0 4px 0 #a82424,0 8px 14px rgba(214,48,49,.3)}
.cbed .rvs{cursor:pointer}
details.kbd{margin:10px 0;text-align:center}details.kbd summary{cursor:pointer;font-weight:700;color:var(--mut);padding:8px;min-height:44px}
@media(min-width:820px){.cbw2{flex-direction:row;align-items:flex-start}.cbw2>.vis{flex:1 1 0;min-width:0}}
@media(min-width:820px){.cbw{flex-direction:row;align-items:flex-start;justify-content:center;gap:28px}.cbw .cbb{flex:0 1 440px}.cbw .cbl{flex:1 1 380px;min-width:340px;max-width:520px}}
.cbc{display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(180deg,#fff,#e9eff7);border-radius:14px;padding:4px;box-shadow:0 0 0 1px var(--line)}
.cbc output{font:800 1.3em system-ui;min-width:1.6em;text-align:center;display:block}
.cbc button{min-height:44px;min-width:44px;padding:0;font-size:1.3em;border-radius:12px}
.nums{display:grid;gap:4px;justify-content:center;margin:6px auto}.nums b{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line);font-size:1.1em}
.front{font-size:.8em;color:var(--mut);text-align:center;margin:2px 0}
/* Misc */
#ov{position:fixed;inset:0;background:rgba(220,230,244,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
#ov .card{max-height:94vh;overflow:auto}
#ab{position:fixed;right:10px;bottom:10px;z-index:40}
table{border-collapse:collapse;width:100%;font-size:.85em}th,td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.cert{background:#fff;border:6px double #8da2bf}.cert .nm{font-size:2em;font-weight:800;color:var(--bl)}
.fl{padding-left:1.1em}.fl li{margin:.5em 0}
details.card summary{cursor:pointer;font-weight:800}
.res{text-align:center}.res .big2{font-size:2.8em;letter-spacing:.1em;filter:drop-shadow(0 6px 6px rgba(40,70,120,.25))}
.res .star{display:inline-block;animation:spop .55s both}.res .star:nth-child(2){animation-delay:.25s}.res .star:nth-child(3){animation-delay:.5s}
@keyframes spop{from{transform:scale(0) rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
.cf{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:60;pointer-events:none;animation:cfall var(--t,2.2s) cubic-bezier(.3,.6,.6,1) forwards}
@keyframes cfall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

/* ---- Hintergrund: ruhige schwebende Lichtpunkte ---- */
(function(){const c=$('#emb'),x=c.getContext('2d');let W,H,P=[];const cols=['#bff0c4','#ffe9b0','#d7f3ff','#ffffff'];
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(16,Math.round(W*H/60000))},()=>({x:Math.random()*W,y:Math.random()*H,r:40+Math.random()*80,c:cols[R(0,3)],vy:.04+Math.random()*.1,vx:(Math.random()-.5)*.08,ph:Math.random()*6}))};
 addEventListener('resize',rs);rs();
 function f(t){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.vy;p.x+=p.vx;if(p.y<-120){p.y=H+120;p.x=Math.random()*W}const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,p.c);g.addColorStop(1,'rgba(255,255,255,0)');x.globalAlpha=.35+.15*Math.sin(t/1600+p.ph);x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1;if(!REDUCED)requestAnimationFrame(f)}
 requestAnimationFrame(f)})();

/* ===== TEMPORÄRER PASSWORTSCHUTZ (zum Entfernen: GATE_ON auf false setzen oder diesen ganzen Block löschen) ===== */
const GATE_ON=false;
(function(){if(!GATE_ON)return;
 const PW=()=>String(new Date().getFullYear()-10);
 let ok=false;try{ok=sessionStorage.getItem('sportGate')===PW()}catch(e){}
 if(ok)return;
 const g=document.createElement('div');g.id='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.setAttribute('aria-labelledby','gt');
 g.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,#ffffff,#dfe9f7 60%,#b9c8e2);overflow:auto';
 g.innerHTML=`<div class="card c" style="width:min(480px,100%)"><h1 id="gt">🔒 Sportfest</h1><p>Diese Seite ist noch gesperrt. Bitte gib das <b>Passwort</b> ein.</p><p class="mut"><b>Tipp:</b> Aktuelles Kalenderjahr − 10</p><form id="gf" autocomplete="off" style="display:grid;gap:12px;justify-items:center"><label for="gp" style="font-weight:700">Passwort</label><input id="gp" type="password" inputmode="numeric" autocomplete="off" maxlength="12" style="width:220px;max-width:100%;text-align:center;font-size:1.4em;padding:.4em;border:2px solid #9fb0c8;border-radius:14px" aria-describedby="ge"><label style="font-size:.9em"><input type="checkbox" id="gs"> Passwort anzeigen</label><button class="big" type="submit">Weiter ➜</button></form><p id="ge" role="alert" style="min-height:1.5em;color:var(--no);font-weight:700"></p></div>`;
 document.body.appendChild(g);
 const lock=e=>{if(e!==g&&e.nodeType==1){e.setAttribute('inert','');e.setAttribute('aria-hidden','true')}};
 [...document.body.children].forEach(lock);
 const mo=new MutationObserver(l=>l.forEach(m=>m.addedNodes.forEach(lock)));mo.observe(document.body,{childList:true});
 const inp=g.querySelector('#gp');inp.focus();
 g.querySelector('#gs').onchange=e=>{inp.type=e.target.checked?'text':'password'};
 g.querySelector('#gf').onsubmit=e=>{e.preventDefault();
  if(inp.value.trim()===PW()){try{sessionStorage.setItem('sportGate',PW())}catch(x){}
   mo.disconnect();g.remove();[...document.body.children].forEach(c=>{c.removeAttribute('inert');c.removeAttribute('aria-hidden')});
   const u=document.querySelector('#un');u&&u.focus()}
  else{g.querySelector('#ge').textContent='Das Passwort stimmt nicht. Versuche es noch einmal.';inp.select()}};
})();

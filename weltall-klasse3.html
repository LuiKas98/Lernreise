<script>
const $=s=>document.querySelector(s),M=$('main');
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>[...a].sort(()=>Math.random()-.5),pk=a=>a[R(0,a.length-1)];
/* Aufgabenformate: mc = Auswahl, in = Eingabe, ins = mehrere Lücken, dd = Sortieren, ord = Reihenfolge, img = Felder anklicken, mem = Memo, mat = Zuordnen */
const MC=(q,a,w,h,x={})=>({t:'mc',q,a:String(a),o:[a,...w].map(String),h,...x});
const IN=(q,a,h,x={})=>({t:'in',q,a:String(a),h,...x});
const DD=(q,b,it,h,x={})=>({t:'dd',q,b,it,h,...x});
const INS=(q,parts,h,x={})=>({t:'ins',q,parts,ans:parts.filter(p=>typeof p!='string').map(p=>String(p.a)),h,...x});
const ORD=(q,s,h,x={})=>({t:'ord',q,s,it:[...s],h,...x});
const IMG=(q,it,h,x={})=>({t:'img',q,it,h,...x});
const MEM=(q,pr,h,x={})=>({t:'mem',q,pr,h,...x});
const MAT=(q,pr,h,x={})=>({t:'mat',q,pr,h,...x});
const NM=a=>{const s=new Set();for(const x of [a+10,a-10,a+1,a-1,a+2,a-2,a+5])if(x>=0&&x!==a&&s.size<3)s.add(x);return[...s]};
const NQ=(q,a,h)=>MC(q,a,NM(a),h);
const L=['Leicht','Mittel','Schwierig'],LC=['🟢','🟡','🔴'];
/* Zufällige Auswahl aus einem Aufgabenpool: höchstens 2 Aufgaben pro Format, solange der Pool es erlaubt */
const draw=(pool,l,n,cnt={})=>{const out=[],used=new Set;
 for(const lim of[2,9])for(const f of sh(pool)){if(out.length>=n)break;if(used.has(f))continue;const t=f(l);if(!t||(cnt[t.t]||0)>=lim)continue;cnt[t.t]=(cnt[t.t]||0)+1;used.add(f);out.push(t)}
 return sh(out)};
const bal=(gen,k,i=1)=>{let it;for(let n=0;n<80;n++){it=gen();if(new Set(it.map(x=>x[i])).size>=k)return it}return it};
const uniq=(n,gen)=>{const s=new Set;for(let i=0;i<500&&s.size<n;i++)s.add(gen());return[...s]};
/* ---------- Zahlwörter ---------- */
const W1=['','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'],W10=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
const nw=n=>n<20?W1[n]:n%10==0?W10[n/10]:(n%10==1?'ein':W1[n%10])+'und'+W10[Math.floor(n/10)];
const fm=(h,m)=>h+':'+String(m).padStart(2,'0')+' Uhr';
const clk=(h,m,w=150)=>`<svg viewBox="0 0 100 100" width="${w}" role="img" aria-label="Eine Uhr"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#1b1464" stroke-width="5"/><g font-size="12" font-weight="bold" text-anchor="middle" fill="#1b1464"><text x="50" y="22">12</text><text x="82" y="55">3</text><text x="50" y="92">6</text><text x="18" y="55">9</text></g><line x1="50" y1="50" x2="50" y2="28" stroke="#e63757" stroke-width="6" stroke-linecap="round" transform="rotate(${(h%12+m/60)*30} 50 50)"/><line x1="50" y1="50" x2="50" y2="12" stroke="#1b1464" stroke-width="4" stroke-linecap="round" transform="rotate(${m*6} 50 50)"/></svg>`;
const tw=(h,m)=>{const n=h%12+1;return m==0?(h==1?'ein':W1[h])+' Uhr':m==30?'halb '+W1[n]:m==15?'Viertel nach '+W1[h]:'Viertel vor '+W1[n]};
/* ===================== KLASSE 3 (orientiert am LehrplanPLUS Bayern, Jgst. 3) ===================== */
const HID=true;
const NAMES=['Mia','Ben','Lena','Tom','Eva','Paul','Nele','Jan'];
const sg=s=>s?'−':'+';
const ZE=(c)=>{const e=Math.floor(c/100),ct=String(c%100).padStart(2,'0');return`${e},${ct} €`};
const ZA=(c)=>{const e=Math.floor(c/100),ct=String(c%100).padStart(2,'0');return`${e},${ct} €|${e},${ct}€|${e},${ct}|${e}.${ct}`};
/* ---------- Planet 1: Rechni (Plus und Minus bis 1000) ---------- */
function c3(l,s){let a,b;
 if(l==0){a=10*R(8,90);b=10*R(1,Math.min(40,s?a/10-1:99-a/10+10));if(!s&&a+b>1000)b=1000-a>=10?10*R(1,(1000-a)/10):10}
 else if(l==1){if(!s){a=R(100,700);b=R(11,Math.min(299,1000-a))}else{a=R(300,999);b=R(11,Math.min(299,a-1))}}
 else{if(!s){a=R(250,800);b=R(120,Math.min(699,1000-a));let n=0;while((a%10)+(b%10)<10&&n++<80)b=R(120,Math.min(699,1000-a))}else{a=R(300,999);b=R(120,Math.min(699,a-1));let n=0;while((a%10)>=(b%10)&&n++<80)b=R(120,Math.min(699,a-1))}}
 return[a,b,s?a-b:a+b]}
const calcs3=(l,n)=>{const r=new Set,o=[];for(let i=0;i<500&&o.length<n;i++){const s=R(0,1),[a,b,c]=c3(l,s);if(r.has(c))continue;r.add(c);o.push([`${a} ${sg(s)} ${b}`,c])}return o};
const RH3=['Rechne erst die Hunderter und Zehner, dann die Einer. Zum Beispiel: 340 + 250 = 590.','Zerlege die zweite Zahl: 346 + 127 = 346 + 100 + 20 + 7.','Rechne Stelle für Stelle von rechts nach links. Denke an den Übertrag oder das Entbündeln.'];
const rP=[
 l=>{const[a,b,r]=c3(l,0);return NQ(`Rechne: ${a} + ${b} = ?`,r,RH3[l])},
 l=>{const[a,b,r]=c3(l,1);return IN(`Rechne: ${a} − ${b} = ? (nur die Zahl)`,r,RH3[l])},
 l=>{const[a,b,r]=c3(l,0);return IN(`Welche Zahl fehlt? ${a} + __ = ${r} (nur die Zahl)`,b,RH3[l])},
 l=>{const[a,b,r]=c3(l,1);return IN(`Welche Zahl fehlt? ${a} − __ = ${r} (nur die Zahl)`,b,RH3[l])},
 l=>{const z=R(0,1),[a,b,r]=c3(l,z);return MC(`Welches Zeichen fehlt? ${a} __ ${b} = ${r}`,sg(z),[sg(1-z)],'Wird die Zahl größer oder kleiner? Dann weißt du: plus oder minus.')},
 l=>{const th=[400,500,600][l];return DD(`Sortiere die Rechnungen: Ist das Ergebnis kleiner als ${th} oder mindestens ${th}?`,['kleiner als '+th,th+' oder mehr'],bal(()=>calcs3(l,6).map(([q,r])=>[q,r<th?0:1]),2),'Rechne jede Aufgabe aus und vergleiche mit '+th+'.')},
 l=>MEM('Memo: Finde zu jeder Rechnung das Ergebnis!',calcs3(l,l?4:3).map(([q,r])=>[q,String(r)]),'Rechne die Aufgaben im Kopf. Merke dir, wo die Karten liegen.'),
 l=>{const o=[],seen=new Set;for(let i=0;i<300&&o.length<3;i++){const[a,b,c]=c3(l,0);if(seen.has(c))continue;seen.add(c);o.push([`${a} + ${b} = ${c}`,`${c} − ${b} = ${a}`])}return MAT('Finde die Umkehraufgabe. Ordne zu.',o,'Bei der Umkehraufgabe rechnest du zurück: Aus plus wird minus.')},
 l=>{const s=l==0?uniq(4,()=>10*R(5,99)):l==1?uniq(4,()=>R(100,999)):(()=>{const t=100*R(1,8)+10*R(0,9);return uniq(4,()=>t+R(0,9))})();return ORD('Ordne die Zahlen. Die kleinste Zahl steht zuerst.',s.sort((x,y)=>x-y).map(String),'Vergleiche zuerst die Hunderter, dann die Zehner, dann die Einer.')},
 l=>{const th=[400,500,600][l];return IMG(`Tippe alle Rechnungen an, deren Ergebnis größer als ${th} ist.`,bal(()=>calcs3(l,6).map(([q,r])=>['',q,r>th?1:0]),2,2),'Rechne jede Aufgabe aus. Tippe nur die an, deren Ergebnis größer ist.')},

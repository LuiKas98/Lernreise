<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konzerthaus · Klasse 2</title>
<style>
:root{--c1:#ff7a59;--c2:#ffb347;--c3:#2ec4b6;--c4:#5aa2ff;--c5:#9b5de5;--ink:#1d1b3a;--mut:#c9c3ee;--ok:#34d98b;--no:#ff6b6b;--gb:rgba(255,255,255,.26)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:#fff;font:600 18px/1.45 "Nunito","Quicksand",ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(900px 600px at 10% -5%,#5d2a8f 0,transparent 62%),radial-gradient(800px 600px at 105% 8%,#17508f 0,transparent 58%),radial-gradient(900px 700px at 50% 118%,#b4457a 0,transparent 60%),#0e1030;background-attachment:fixed}
#emb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:12px 16px 56px}
#app.wide{max-width:980px}
h1,h2{font-weight:900;letter-spacing:.01em}
h1{font-size:1.5em;margin:.3em 0;line-height:1.15}h2{font-size:1.15em;margin:.3em 0}
p{margin:.55em 0}
.c{text-align:center}.mini,small{color:var(--mut);font-size:.85em;font-weight:600}small{display:block}
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border:1px solid var(--gb);border-radius:26px;padding:16px 18px;margin:14px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 40px rgba(5,4,30,.45);-webkit-backdrop-filter:blur(16px) saturate(1.35);backdrop-filter:blur(16px) saturate(1.35)}
button,.lnk{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:18px;min-height:48px;padding:.55em 1.1em;color:#fff;text-decoration:none;display:inline-block;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 0 rgba(8,6,40,.5),0 10px 18px rgba(5,4,30,.3);transition:transform .12s,box-shadow .12s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.14)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 rgba(8,6,40,.5),0 3px 8px rgba(5,4,30,.3)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.lnk:focus-visible,input:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:4px solid #7fd0ff;outline-offset:3px}
.big{background:linear-gradient(180deg,#ffe08a,#ffae3d 55%,#ff7a59);color:#3a1400;font-size:1.08em;padding:.7em 1.4em;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 #b4511f,0 14px 26px rgba(255,122,89,.35);margin:.2em}
.big:active:not(:disabled){box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 2px 0 #b4511f,0 6px 12px rgba(255,122,89,.35)}
.sm{min-height:44px;padding:.35em .85em;font-size:.9em}
.sec{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05))}
.back{background:rgba(255,255,255,.14)}
input[type=text],input:not([type]){font:inherit;font-weight:700;padding:.65em .9em;border-radius:16px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.95);color:var(--ink);width:min(320px,100%);text-align:center;box-shadow:inset 0 2px 6px rgba(0,0,0,.15)}
#ue{color:#ffb3a8;min-height:1.4em}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}.bar h1{margin:0;font-size:1.3em}
/* Hub */
.logo{text-align:center;margin:2px 0 0}
.logo span{display:block;font:italic 900 2.55em/1.05 "Nunito","Quicksand",ui-rounded,system-ui,sans-serif;background:linear-gradient(90deg,#ff8a6b,#ffd23f 28%,#5be3b8 52%,#6aa5ff 76%,#d58bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(8,6,40,.55)) drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.logo small{color:#e8e2ff;font-size:.95em;margin-top:2px}
.scene{display:block;width:100%;height:auto;max-width:540px;margin:8px auto;border-radius:30px;box-shadow:0 22px 50px rgba(3,2,25,.65),0 0 0 1px rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.1);background:#1b2250;touch-action:manipulation;overflow:hidden}
.scene [role=button]{cursor:pointer;outline:none}
.scene .px{transition:transform .25s ease-out;will-change:transform}
.scene .hl{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,0);stroke-width:3;transition:.25s}
.scene [role=button]:hover .hl,.scene [role=button]:focus-visible .hl{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.85)}
.bd{transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}
.scene [role=button]:hover .bd,.scene [role=button]:focus-visible .bd{transform:translateY(-5px) scale(1.025)}
.win{animation:tw 3.4s ease-in-out infinite}.win:nth-of-type(2n){animation-delay:-1.3s}.win:nth-of-type(3n){animation-delay:-2.2s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.6}}
.stw{animation:tw 2.6s ease-in-out infinite}.stw:nth-of-type(3n){animation-delay:-.9s}.stw:nth-of-type(5n){animation-delay:-1.7s}
.eif{animation:tw 1.1s steps(2) infinite}
.beam{transform-origin:72px 84px;animation:sweep 7s ease-in-out infinite}@keyframes sweep{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(38deg)}}
.cloud{animation:drift 60s linear infinite}@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wv{animation:wv 5s linear infinite}@keyframes wv{to{transform:translateX(-40px)}}
.drift{animation:dr 9s linear infinite;opacity:0}@keyframes dr{0%{transform:translateY(-20px);opacity:0}15%{opacity:.9}90%{opacity:.7}100%{transform:translateY(560px);opacity:0}}
.steam{animation:st 3s ease-in infinite;opacity:0}@keyframes st{0%{transform:translateY(4px);opacity:0}40%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
.splash circle{animation:splash .95s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes splash{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.pn{font:900 13.5px "Nunito",ui-rounded,system-ui,sans-serif;fill:#fff;text-anchor:start}
.ps{font:700 11px "Nunito",ui-rounded,system-ui,sans-serif;fill:#ffe9b8;text-anchor:start}
.prog{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}
.prog span{background:rgba(255,255,255,.12);border:1px solid var(--gb);border-radius:20px;padding:.2em .9em;font-size:.95em;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0}
.tools>*{min-width:82px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45em .6em;font-size:.82em;line-height:1.1}
.tools>*>span{font-size:1.6em;line-height:1}
/* Lernpfad */
.hdr{display:flex;align-items:center;gap:14px;margin:6px 0 10px}.hdr .ico{font-size:2.6em;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.path{list-style:none;margin:6px 0 16px;padding:0}
.path li{position:relative;display:flex;align-items:center;gap:14px;margin:0 0 30px;padding:0}
.path li:nth-child(even){flex-direction:row-reverse;text-align:right}
.path li:nth-child(odd){margin-right:8%}.path li:nth-child(even){margin-left:8%}
.path li:not(:last-child)::after{content:"";position:absolute;top:100%;width:8px;height:24px;margin-top:3px;background:radial-gradient(circle,rgba(255,255,255,.55) 2.5px,transparent 3px) 50% 0/8px 12px repeat-y}
.path li:nth-child(odd)::after{left:46px}.path li:nth-child(even)::after{right:46px}
.gem{flex:none;width:92px;height:92px;border-radius:50%;padding:0;font-size:2.3em;display:flex;align-items:center;justify-content:center;border:0;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 38%),var(--g,linear-gradient(160deg,#ffb347,#ff7a59));box-shadow:inset 0 -8px 14px rgba(0,0,0,.25),0 8px 0 var(--gd,#a8431f),0 18px 24px rgba(0,0,0,.4)}
.gem:active:not(:disabled){transform:translateY(5px);box-shadow:inset 0 -8px 14px rgba(0,0,0,.25),0 3px 0 var(--gd,#a8431f),0 8px 14px rgba(0,0,0,.4)}
.gem:disabled{--g:linear-gradient(160deg,#6d6a8c,#45436a);--gd:#2c2a48;opacity:.9}
.gem.done{outline:4px solid #ffe08a;outline-offset:3px}
.plb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.plb b{font-size:1.15em;font-weight:900}.plb .stars{letter-spacing:.1em;font-size:1.1em}
/* Aufgaben */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.12);border:1px solid var(--gb);border-radius:22px;padding:6px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hud .ttl{flex:1;min-width:0;text-align:center;overflow-wrap:anywhere;line-height:1.15;font-weight:900}
.pbar{display:flex;gap:5px;margin:10px 4px}.pbar i{flex:1;height:12px;border-radius:8px;background:rgba(255,255,255,.18);box-shadow:inset 0 2px 3px rgba(0,0,0,.3);transition:.3s}
.pbar i.g{background:linear-gradient(180deg,#8dffc0,#22c779);box-shadow:0 0 12px rgba(52,217,139,.7)}.pbar i.r{background:linear-gradient(180deg,#ffc2a8,#ff8a5c);box-shadow:0 0 10px rgba(255,138,92,.5)}.pbar i.c{background:linear-gradient(180deg,#fff2c2,#ffc34d);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.3)}}
.q{font-size:1.3em;font-weight:900;text-align:center;margin:.2em 0 .6em;line-height:1.25}
.vis{text-align:center;margin:.3em 0 .7em}
.vis svg{max-width:100%;height:auto;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.35);background:#fffdf5}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.c1{grid-template-columns:1fr}
.o{min-width:0;overflow-wrap:anywhere;min-height:70px;font-size:1.12em;font-weight:900;color:var(--ink);background:linear-gradient(180deg,#fff,#e9ebff);padding:.45em .55em;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;text-align:center;line-height:1.2;border-radius:20px;box-shadow:inset 0 2px 0 #fff,0 6px 0 rgba(10,8,50,.45),0 14px 22px rgba(5,4,30,.35)}
.o:hover:not(:disabled){filter:none;transform:translateY(-3px);box-shadow:inset 0 2px 0 #fff,0 9px 0 rgba(10,8,50,.45),0 18px 26px rgba(5,4,30,.4)}
.o:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 #fff,0 2px 0 rgba(10,8,50,.45),0 6px 10px rgba(5,4,30,.35)}
.o.ok{background:linear-gradient(180deg,#c4ffe0,#5fe9a6);color:#073b22;animation:pop .45s}.o.no{background:linear-gradient(180deg,#ffd7d2,#ff9d94);color:#5a1510;opacity:.85;animation:shake .4s}
.o:disabled{opacity:1}.o.no:disabled{opacity:.7}
@keyframes pop{40%{transform:scale(1.07)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.o svg{max-width:100%;height:auto;border-radius:10px}
.sw{display:block;width:100%;min-width:44px;height:50px;border-radius:12px;border:0;position:relative;box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -5px 8px rgba(0,0,0,.2),0 3px 6px rgba(0,0,0,.25)}
.sw.b{height:66px}.sw i{position:absolute;left:8px;top:2px;font:900 1.1rem/1.6 system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;font-style:normal}
.dot{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;vertical-align:-.2em;box-shadow:inset 0 2px 2px rgba(255,255,255,.55),inset 0 -3px 3px rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.3)}
.pair{display:flex;align-items:center;gap:6px;justify-content:center}
.fbk{min-height:2.6em;text-align:center;font-weight:800;margin:.6em 0}
.fbk.ok{color:var(--ok)}.fbk.no{color:#ffb3a8}
.fun{background:rgba(255,196,77,.16);border-left:5px solid #ffb347;border-radius:12px;padding:.55em .9em;margin:.5em 0;text-align:left;font-weight:600}
.say{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
/* Mischlabor */
.mixrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.mixcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.stage{position:relative;height:160px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cap{height:1.6em;text-align:center;font-weight:900;font-size:.95em;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{width:78%;height:78%;border-radius:16px;background:var(--cc);box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -10px 16px rgba(0,0,0,.2),0 12px 20px rgba(0,0,0,.4);transform:rotate(-4deg);position:relative}
.chip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:rgba(255,255,255,.92);border-radius:0 0 16px 16px}
.chip .cl{position:absolute;left:0;right:0;bottom:0;height:24%;display:flex;align-items:center;justify-content:center;z-index:1;color:var(--ink);font-weight:900;font-size:.95em}
.bowl3{width:100%;height:100%;display:block}
.lq{transition:fill .35s,transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.rip{fill:none;stroke:#fff;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.rip.go{animation:rip .7s ease-out}@keyframes rip{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
.bowlbox.win3 .glow{opacity:1}.glow{opacity:0;transition:.4s}
.dropchips{position:absolute;left:0;right:0;bottom:6px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.pots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 6px}
.pot{flex:1 1 84px;max-width:118px;min-width:74px;display:flex;flex-direction:column;align-items:center;gap:0;padding:.3em .3em .5em;font-weight:900;font-size:.92em;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06))}
.pot svg{width:100%;max-width:74px;height:auto;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.fall{position:fixed;width:16px;height:22px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;z-index:30;pointer-events:none;transition:transform .34s cubic-bezier(.5,0,1,.6),opacity .34s;box-shadow:inset 3px 3px 3px rgba(255,255,255,.55)}
/* Mappe */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.acard{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border-radius:18px;padding:7px;text-align:center;font-size:.9em;color:#fff;transform:rotate(var(--r,0deg))}
.acard:nth-child(3n+1){--r:-1.2deg}.acard:nth-child(3n+2){--r:1deg}
.acard.lock{filter:grayscale(1);opacity:.5}
.acard svg{width:100%;height:auto;border-radius:12px;display:block}
.acard b{display:block;margin-top:5px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px}
.cat div{text-align:center;font-size:.8em}.cat .sw{height:48px;margin-bottom:3px}.cat .lk{background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 6px,rgba(255,255,255,.04) 6px 12px)}
/* Nachgestalten */
.pgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:840px){.pgrid{grid-template-columns:1fr 1fr}}
.pcard{padding:10px}
.cvw{position:relative}
.cv{display:block;width:100%;aspect-ratio:1/1;background:#fffdf5;border-radius:18px;touch-action:none;cursor:crosshair;box-shadow:0 0 0 4px rgba(255,255,255,.28),0 16px 34px rgba(0,0,0,.5)}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 4px 8px;font-weight:900}
.need{background:rgba(255,255,255,.1);border-radius:16px;padding:.5em .8em;margin:8px 0;font-size:.92em;font-weight:600;line-height:1.35}
.need b{font-weight:900}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.pal button{width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;border:3px solid rgba(255,255,255,.85);background-image:radial-gradient(circle at 32% 26%,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 40%);box-shadow:inset 0 -5px 8px rgba(0,0,0,.25),0 4px 8px rgba(0,0,0,.4)}
.pal button[aria-pressed=true]{outline:4px solid #7fd0ff;outline-offset:3px;transform:scale(1.1)}
.ur{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 2px 2px}.ur button{min-height:52px;font-size:.92em;padding:.3em .3em;line-height:1.1}.ur button:disabled{opacity:.4;filter:saturate(.4)}.ur button[aria-pressed=true]{background:linear-gradient(180deg,#ffe08a,#ffae3d);color:#3a1400;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #b4511f,0 0 16px rgba(255,174,61,.6)}
.pbar i.l{background:linear-gradient(180deg,#d9e4ff,#8fa9ff)}
.mas{width:100%;height:auto;display:block}
.ao{display:flex;align-items:center;gap:12px;text-align:left;width:100%}.ao .mas{width:68px;height:auto;flex:none}.ao>span{flex:1;font-weight:900}
.steck{text-align:left}
.sk-top{display:flex;gap:14px;align-items:center}.sk-fig{width:140px;flex:none;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),rgba(255,255,255,.05));border-radius:24px;padding:6px}
.sk-id h2{margin:0 0 .15em;font-size:1.35em}.sk-y{opacity:.85;font-weight:700}.sk-chip{display:inline-block;margin-top:.5em;background:rgba(255,255,255,.16);border-radius:999px;padding:.25em .8em;font-weight:700;font-size:.92em}
.sk-merk{margin:.8em 0;background:linear-gradient(180deg,#fff3c4,#ffd978);color:#3a2400;border-radius:16px;padding:.7em 1em;font-weight:800;font-size:1.05em;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.sk-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:start}.sk-sket small{display:block;text-align:center;opacity:.8;font-size:.78em}.sk-info p{margin:.2em 0 .6em}.sk-fun{background:rgba(255,196,77,.16);border-left:5px solid #ffb347;border-radius:12px;padding:.45em .8em}
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mc{position:relative;aspect-ratio:1/1.12;padding:0;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#ff8fb1,#7d2554);color:#fff;font-size:2em}
.mc .mf{display:none;position:absolute;inset:0;background:#fffdf5;color:#33243f;flex-direction:column;align-items:center;justify-content:center;font-size:.4em;font-weight:900;padding:4px}
.mc .mf svg{width:100%;height:auto;max-height:78%}.mc .mf .mas{width:62%}
.mc.up .mf{display:flex}.mc.up .mb{display:none}.mc.ok{box-shadow:0 0 0 4px #5fe9a6,0 0 18px rgba(95,233,166,.7)}.mc:disabled{opacity:1}
.spg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:62vh;overflow:auto}.spc{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);border-radius:14px;padding:6px 8px;text-align:left}.spc .mas{width:46px;flex:none}.spc small{display:block;font-size:.8em;opacity:.9;line-height:1.25}
.acm{background:rgba(255,255,255,.12);border-radius:12px;padding:4px 0}.acm svg{width:auto;height:112px;margin:0 auto}
@media(min-width:640px){.mem{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:480px){.sk-row{grid-template-columns:1fr}.spg{grid-template-columns:1fr}.sk-fig{width:112px}}

.gh{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;border-radius:inherit}

 for(let j=0;j<4;j++){drum(j?'click':'click1',base+j*B/1000,.9);cue(300+j*B,()=>{$('#cnt').textContent=String(j+1);$('#cnt').className='cnt big1'})}

function rhyScore(E,S,B){const used=new Set(),m=[];E.forEach((e,k)=>{let bi=-1,bd=1e9;S.forEach((s,j)=>{if(used.has(j))return;const d=Math.abs(s-e);if(d<bd){bd=d;bi=j}});if(bi>=0&&bd<=.5*B){used.add(bi);m.push({k,err:S[bi]-e})}else m.push({k,err:null})});

function rhyWhy(res,N){const per=Math.round(100/N),L=[],tips=new Set();
 res.m.forEach((x,k)=>{const lost=(1-res.sc[k])*100/N;if(lost<1)return;const n=(k+1)+'. Note';
  if(x.err==null){L.push(`${n}: <b>−${Math.round(lost)}</b> – hier hast du nicht geklatscht.`);tips.add('Höre den Rhythmus noch einmal an und sprich ihn mit: „ta“ und „ti-ti“.')}
  else{const d=x.err-res.off,s=Math.abs(Math.round(d/10)/100).toString().replace('.',',');L.push(`${n}: <b>−${Math.round(lost)}</b> – ${d<0?'ein bisschen zu früh':'ein bisschen zu spät'} (etwa ${s} Sekunden).`);tips.add(d<0?'Warte noch einen Moment: Klatsche genau dann, wenn der rote Balken bei der Note ankommt.':'Klatsche ein kleines bisschen früher: genau dann, wenn der rote Balken bei der Note ankommt.')}});

function rhyEval(){const r=G&&G.r;if(!r||r.done||!G.p||G.p.t!='rhy')return;r.done=true;const p=G.p,B=r.B,tS=r.T0+4*B,E=r.P.ons.map(o=>tS+o.t*B),S=r.taps.filter(t=>t>=tS-.55*B).sort((a,b)=>a-b),res=rhyScore(E,S,B);phHide();

function freeComp(){stopG();const rows=[];let g='';for(let r=7;r>=0;r--){g+=`<span class="gl">${NN[r]}${r==7?'′':''}</span>`;for(let c=0;c<8;c++)g+=`<button class="gc${CS.mel[c]===r?' on':''}" id="fc${r}_${c}" style="--cc:${HUE(r)}" aria-pressed="${CS.mel[c]===r}" aria-label="Schlag ${c+1}: Note ${NN[r]}" onclick="fcSet(${c},${r})"></button>`}
 g+=`<span class="gl sp"></span>${Array(8).fill(0).map(()=>'<span class="sp"></span>').join('')}`;BR.forEach((r,ri)=>{g+=`<span class="gl bl">${BI[r]} ${BN[r]}</span>`;for(let c=0;c<8;c++)g+=`<button class="gc${CS.beat[ri][c]?' on':''}" id="fb${ri}_${c}" style="--cc:${['#ff6b6b','#ffd23f','#5be3b8'][ri]}" aria-pressed="${!!CS.beat[ri][c]}" aria-label="${BN[r]}, Schlag ${c+1}" onclick="fbSet(${ri},${c})"></button>`});
 show(`<div class="bar"><button class="back" onclick="leaveComp()">⬅ Studio</button></div><div class="hdr"><span class="ico" aria-hidden="true">🎹</span><div><h1>Frei komponieren</h1><small>Setze Töne und Beats. Jede Spalte ist ein Schlag. Dein Stück hat 2 Takte.</small></div></div><div class="card"><div class="gridm" style="--n:8" role="group" aria-label="Kompositions-Raster">${g}<span></span>${Array.from({length:8},(_,c)=>`<span class="gk" id="fh${c}">${c+1}</span>`).join('')}</div>
 <div class="seg" role="group" aria-label="Instrument">${['klavier','floete','geige','xylophon','gitarre','trompete'].map(i=>`<button aria-pressed="${CS.inst==i}" id="fi_${i}" onclick="fcInst('${i}')" aria-label="${INST[i].n}"><span aria-hidden="true">${instSvg(i,'width:30px;height:30px;vertical-align:middle')}</span> ${INST[i].n}</button>`).join('')}</div>
 <div class="seg" role="group" aria-label="Tempo">${[[70,'🐢 langsam'],[100,'🚶 mittel'],[140,'🐇 schnell']].map(([b,t])=>`<button aria-pressed="${CS.bpm==b}" id="ft_${b}" onclick="fcTempo(${b})">${t}</button>`).join('')}<button aria-pressed="${CS.loop}" id="fl" onclick="fcLoop()">🔁 Wiederholen</button></div>
 <div class="row"><button class="big" id="fplay" onclick="fcPlay()">▶ Abspielen</button><button class="sec" onclick="fcStop()">⏹ Stopp</button><button class="sec" onclick="fcNotes()">🎼 Noten zeigen</button><button class="sec" onclick="fcClear()">🧹 Leeren</button><button class="big" onclick="fcSave()">💾 Speichern</button></div><div id="fnotes" class="vis"></div><p class="mini c" id="fmsg" role="status" aria-live="polite"></p></div>${U.k.length?`<p class="c"><button class="sec" onclick="mappe()">📖 Meine gespeicherten Stücke (${U.k.length})</button></p>`:''}`,true)}
const leaveComp=()=>{CS.run++;stopAll();place('regie')};
function fcSet(c,r){CS.mel[c]=CS.mel[c]===r?null:r;for(let q=0;q<8;q++){const b=$('#fc'+q+'_'+c);b.classList.toggle('on',CS.mel[c]===q);b.setAttribute('aria-pressed',CS.mel[c]===q)}if(CS.mel[c]!=null){ac();tone(CS.inst,MID[CS.mel[c]],NOW0(),.5,.7)}const n=$('#fnotes');n&&n.innerHTML&&fcNotes(true)}
function fbSet(ri,c){CS.beat[ri][c]^=1;const b=$('#fb'+ri+'_'+c);b.classList.toggle('on',!!CS.beat[ri][c]);b.setAttribute('aria-pressed',!!CS.beat[ri][c]);if(CS.beat[ri][c]){ac();drum(BR[ri],NOW0(),.85)}}
const fcInst=i=>{CS.inst=i;document.querySelectorAll('[id^=fi_]').forEach(b=>b.setAttribute('aria-pressed',b.id=='fi_'+i));ac();tone(i,MID[4],NOW0(),.6,.7)};
const fcTempo=b=>{CS.bpm=b;document.querySelectorAll('[id^=ft_]').forEach(x=>x.setAttribute('aria-pressed',x.id=='ft_'+b))};
const fcLoop=()=>{CS.loop=!CS.loop;$('#fl').setAttribute('aria-pressed',CS.loop)};
function fcPlay(){stopAll();const my=++CS.run;ac();const t0=NOW0(),spb=60/CS.bpm;for(let c=0;c<8;c++){if(CS.mel[c]!=null)tone(CS.inst,MID[CS.mel[c]],t0+c*spb,spb*.92,.7);BR.forEach((r,ri)=>{if(CS.beat[ri][c])drum(r,t0+c*spb,.8)});cue(60+c*spb*1000,()=>dflash('fh',c))}
 cue(60+8*spb*1000,()=>{dflash('fh',-1);if(CS.loop&&CS.run==my&&$('#fplay'))fcPlay()})}
const fcStop=()=>{CS.run++;stopAll();dflash('fh',-1)};
function fcNotes(keep){const n=$('#fnotes');if(!keep&&n.innerHTML){n.innerHTML='';return}n.innerHTML=CS.mel.some(x=>x!=null)?staff(CS.mel.map(i=>({i,d:1})),{ts:1,sc:1.7,al:'Deine Melodie als Noten'})+'<small>Leere Schläge sind Viertelpausen.</small>':'<small>Setze zuerst ein paar Töne.</small>'}
function fcClear(){CS.mel=Array(8).fill(null);CS.beat=[Array(8).fill(0),Array(8).fill(0),Array(8).fill(0)];stopAll();freeComp()}
function fcSave(){if(!CS.mel.some(x=>x!=null)&&!CS.beat.some(r=>r.some(x=>x))){$('#fmsg').textContent='Setze zuerst ein paar Töne oder Beats.';return}ovl(`<div class="card c" style="width:min(460px,100%)"><h1>💾 Stück speichern</h1><p>Wie soll dein Stück heißen?</p><p class="mini">Schreibe keinen echten Namen.</p><input id="kn" maxlength="24" autocomplete="off" aria-label="Name deines Stücks" value="${esc(CS.name)}" onkeydown="if(event.key=='Enter')fcSave2()"><p id="ke" role="alert" style="color:#ffb3a8;min-height:1.3em"></p><div class="row"><button class="big" onclick="fcSave2()">Speichern</button><button class="sec" onclick="closeOv()">Abbrechen</button></div></div>`);const k=$('#kn');k&&k.focus()}
function fcSave2(){const v=nrm($('#kn').value)||'Mein Stück';if(isReal(v)){$('#ke').textContent='Das sieht nach einem echten Namen aus. Wähle einen anderen Titel.';return}CS.name=v;U.k.push({n:v,mel:[...CS.mel],beat:CS.beat.map(r=>[...r]),inst:CS.inst,bpm:CS.bpm});if(U.k.length>8)U.k.shift();save();closeOv();const m=$('#fmsg');m&&(m.textContent='✔ „'+v+'“ ist in deiner Mappe gespeichert.');confetti(20)}
function playSaved(i){const s=U.k[i];if(!s)return;stopAll();ac();const t0=NOW0(),spb=60/s.bpm;for(let c=0;c<8;c++){if(s.mel[c]!=null)tone(s.inst,MID[s.mel[c]],t0+c*spb,spb*.92,.7);BR.forEach((r,ri)=>{if(s.beat[ri][c])drum(r,t0+c*spb,.8)})}}
function loadSaved(i){const s=U.k[i];if(!s)return;CS={mel:[...s.mel],beat:s.beat.map(r=>[...r]),inst:s.inst,bpm:s.bpm,loop:false,run:0,name:s.n};freeComp()}
function delSaved(i){if(confirm('Dieses Stück löschen?')){U.k.splice(i,1);save();mappe()}}
/* ---- Mappe, Urkunde, Ergebnisse ---- */
function mappe(){stopG();show(`<div class="bar"><button class="back" onclick="hub()">⬅ Konzertsaal</button></div><div class="hdr"><span class="ico" aria-hidden="true">📖</span><div><h1>Meine Mappe</h1><small>Instrumente, Komponisten, Lieder und deine eigenen Stücke.</small></div></div>
 <div class="card"><h2>🎻 Instrumente (${nInst()} / ${SOUNDS.length})</h2><p class="mini">Erkenne ein Instrument am Klang, dann bekommst du seine Karte.</p><div class="cards">${SOUNDS.map(i=>{const o=isAd()||U.c[i];return `<button class="acard${o?'':' lock'}" ${o?`onclick="instCard('${i}')"`:'disabled'} aria-label="${o?INST[i].n:'Noch gesperrte Karte'}"><div class="acm">${o?instSvg(i,'height:100px;width:auto;margin:0 auto'):'<svg viewBox="0 0 120 120" style="height:100px"><text x="60" y="90" text-anchor="middle" font-size="80" fill="#9a93cf">?</text></svg>'}</div><b>${o?INST[i].n:'???'}</b>${o?`<small>${INST[i].fam}</small>`:''}</button>`}).join('')}</div></div>
 <div class="card"><h2>🎼 Komponisten (${nKomp()} / ${KOMP.length})</h2><div class="cards">${KOMP.map(k=>{const o=isAd()||U.a[k.id];return `<button class="acard${o?'':' lock'}" ${o?`onclick="kompCard('${k.id}')"`:'disabled'} aria-label="${o?k.n:'Noch gesperrte Karte'}"><div class="acm">${o?compo(k.id):'<svg viewBox="0 0 120 140" style="height:112px"><text x="60" y="100" text-anchor="middle" font-size="80" fill="#9a93cf">?</text></svg>'}</div><b>${o?k.k:'???'}</b>${o?`<small>${k.y}</small>`:''}</button>`}).join('')}</div></div>
 <div class="card"><h2>🎵 Lieder (${nSongs()} / ${Object.keys(SONGS).length})</h2>${Object.entries(SONGS).map(([id,s])=>{const o=isAd()||U.m[id];return `<p style="margin:.4em 0">${o?`<button class="sm sec" onclick="playMel('klavier',SONGS['${id}'].m,104)" aria-label="${s.n} anhören">▶</button> ${s.e} ${s.n}`:'🔒 ???'}</p>`}).join('')}</div>
 <div class="card"><h2>🏅 Meine Bestwerte</h2>${PSC.map(l=>`<p style="margin:.35em 0">${l.e} ${l.n}: <b>${U.q[l.id]!=null?U.q[l.id]+' Punkte':'–'}</b></p>`).join('')}</div>
 <div class="card"><h2>💾 Meine Stücke (${U.k.length})</h2>${U.k.length?U.k.map((s,i)=>`<div class="row" style="justify-content:space-between;margin:.4em 0"><b>${esc(s.n)}</b><span><button class="sm" onclick="playSaved(${i})" aria-label="${esc(s.n)} anhören">▶</button> <button class="sm sec" onclick="loadSaved(${i})">✏️ Öffnen</button> <button class="sm sec" onclick="delSaved(${i})" aria-label="${esc(s.n)} löschen">🗑️</button></span></div>`).join(''):'<p class="mini">Noch nichts gespeichert. Im Komponier-Studio kannst du eigene Stücke erfinden.</p>'}</div>`)}
function instCard(i){ovl(`<div class="card c" style="width:min(460px,100%)"><h1>${INST[i].n}</h1><div class="vis" style="background:none">${instSvg(i,'width:150px;height:auto;background:none;box-shadow:none')}</div><p><span class="sk-chip">Familie: ${INST[i].fam}</span></p><p>${INST[i].txt}</p><p><button class="big" onclick="hear('${i}')">🔊 Anhören</button> <button class="sec" onclick="closeOv()">Schließen</button></p></div>`)}
function kompCard(id){const c=KID[id];ovl(`<div class="card" style="width:min(520px,100%)">${plain(kompLearn(c).html)===''?'':kompLearn(c).html}<p class="c"><button class="big" onclick="closeOv()">Schließen</button></p></div>`)}
function cert(){stopG();const best=PSC.reduce((a,l)=>Math.max(a,U.q[l.id]||0),0);show(`<button class="back noprint" onclick="hub()">⬅ Zurück</button><div class="card c cert"><h1>📜 Konzerthaus-Urkunde</h1><p>für</p><p class="nm" id="nm">Junge/r Musiker/in</p><p class="noprint"><label>Name (wird nicht gespeichert): <input id="ni" maxlength="30" oninput="$('#nm').textContent=this.value||'Junge/r Musiker/in'"></label></p><p>hat im Konzerthaus <b>${sumStars()}</b> von ${MAXS} Sternen gesammelt,<br><b>${nInst()}</b> von ${SOUNDS.length} Instrumenten am Klang erkannt,<br><b>${nKomp()}</b> von ${KOMP.length} Komponisten kennengelernt,<br><b>${nSongs()}</b> von ${Object.keys(SONGS).length} Liedern erkannt<br>und <b>${U.k.length}</b> eigene${U.k.length==1?'s Stück':' Stücke'} komponiert${best?` (beste Punktzahl: ${best} von 100)`:''}.</p><p>Bravo und herzlichen Glückwunsch!</p><p class="noprint"><button class="big" onclick="window.print()">🖨️ Drucken</button></p></div>`)}
function results(){const sm=u=>Object.values(u.s||{}).reduce((a,b)=>a+b,0);ovl(`<div class="card" style="width:min(900px,100%)"><div class="bar"><h1>📊 Ergebnisse</h1><button onclick="closeOv()">✖ Schließen</button></div>${Object.keys(DB.u).length?'':'<p>Auf diesem Gerät hat noch kein Kind gespielt.</p>'}${Object.entries(DB.u).map(([n,u])=>`<details><summary><b>${esc(n)}</b> · ⭐ ${sm(u)} von ${MAXS} · 🎻 ${SOUNDS.filter(i=>(u.c||{})[i]).length} · 🎼 ${KOMP.filter(k=>(u.a||{})[k.id]).length} · 🎵 ${Object.keys(SONGS).filter(i=>(u.m||{})[i]).length} · 💾 ${(u.k||[]).length} · ${u.r} von ${u.n} Aufgaben gelungen</summary><p>${LV.map(l=>`${PLACE[l.pl].n} – ${l.n}: ${'⭐'.repeat((u.s||{})[l.id]||0)||'–'}${l.t=='sc'&&(u.q||{})[l.id]!=null?' ('+u.q[l.id]+' Punkte)':''}`).join('<br>')}</p>${(u.f||[]).length?`<div style="overflow-x:auto"><table><tr><th>Station</th><th>Aufgabe</th><th>Richtig wäre</th><th>Antwort des Kindes</th></tr>${u.f.map(f=>`<tr><td>${esc(f.l)}</td><td>${esc(f.q)}</td><td>${esc(f.a)}</td><td>${esc(f.g)}</td></tr>`).join('')}</table></div>`:'<p>Keine Fehler. 🎉</p>'}</details>`).join('')}<p><small>Die Daten liegen nur in diesem Browser auf diesem Gerät.</small></p><button class="sec" onclick="if(confirm('Alle Ergebnisse auf diesem Gerät löschen?')){DB.u={};save();results()}">🗑️ Alle Daten löschen</button></div>`)}
/* ---- Hintergrund: schwebende Lichter ---- */
(function(){const c=$('#emb'),x=c.getContext('2d');let W,H,P=[];const cols=['#ffd36e','#ff8fb1','#7fe3c8','#8fb5ff','#d58bff','#ff7a59'];
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(22,Math.round(W*H/42000))},()=>({x:Math.random()*W,y:Math.random()*H,r:30+Math.random()*70,c:cols[R(0,5)],vy:.05+Math.random()*.14,vx:(Math.random()-.5)*.1,ph:Math.random()*6}))};
 addEventListener('resize',rs);rs();
 function f(t){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.vy;p.x+=p.vx;if(p.y<-120){p.y=H+120;p.x=Math.random()*W}const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,p.c);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=.15+.08*Math.sin(t/1400+p.ph);x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1;if(!REDUCED)requestAnimationFrame(f)}
 requestAnimationFrame(f)})();
addEventListener('pagehide',stopAll);
DB.cur&&DB.u[DB.cur]?login(DB.cur):(U=mkU(),hub(),ask());

</script></body></html>
